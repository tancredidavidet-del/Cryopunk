<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRYOPUNK: TACTICAL REALISM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        body { font-family: 'Orbitron', sans-serif; background: #000; margin: 0; overflow: hidden; color: #fff; }
        canvas { display: block; position: fixed; inset: 0; z-index: 1; }
        
        /* HUD MILITARE */
        .ui-layer { position: relative; z-index: 10; pointer-events: none; height: 100vh; display: flex; flex-direction: column; padding: 20px; }
        .ui-layer * { pointer-events: auto; }
        .milit-panel { background: rgba(0, 10, 5, 0.7); border: 1px solid rgba(0, 255, 100, 0.3); border-left: 4px solid #0f0; backdrop-filter: blur(5px); padding: 15px; }
        
        /* SELEZIONE */
        .selection-screen { position: fixed; inset: 0; z-index: 500; background: radial-gradient(circle, #111 0%, #000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .milit-card { background: rgba(20,20,20,0.9); border: 1px solid #333; transition: 0.3s; cursor: pointer; width: 100%; max-width: 350px; margin-bottom: 12px; padding: 20px; position: relative; overflow: hidden; }
        .milit-card::before { content: ""; position: absolute; top:0; left:0; width: 2px; height: 100%; background: #555; }
        .milit-card:hover { border-color: #0f0; background: rgba(0,255,0,0.05); }
        .milit-card.occupied { opacity: 0.4; filter: grayscale(1); pointer-events: none; border-color: #f00; }
        
        /* CONTROLLI TATTICI */
        .d-pad { position: fixed; bottom: 40px; left: 40px; display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; }
        .ctrl-btn { width: 60px; height: 60px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .ctrl-btn:active { background: #0f0; color: #000; }
        
        .action-btns { position: fixed; bottom: 40px; right: 40px; display: flex; flex-direction: column; gap: 15px; }
        .milit-btn { background: rgba(255,255,255,0.1); border: 1px solid #fff; padding: 12px 30px; font-size: 10px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .milit-btn.primary { background: #0f0; color: #000; border-color: #0f0; }
    </style>
</head>
<body>

    <div id="selection-screen" class="selection-screen">
        <div class="mb-10 text-center">
            <h1 class="text-white text-3xl font-black tracking-widest uppercase mb-2">Cryopunk: Tactical</h1>
            <p class="text-emerald-500 text-[8px] tracking-[0.4em] uppercase">Sincronizzazione Unità Operative</p>
        </div>
        <div id="char-grid" class="w-full flex flex-col items-center"></div>
    </div>

    <div id="game-ui" class="ui-layer hidden">
        <header class="flex justify-between items-start">
            <div class="milit-panel w-64">
                <div id="char-name" class="text-[10px] font-black tracking-tighter mb-1 text-emerald-400">---</div>
                <div class="h-1 w-full bg-neutral-800"><div id="hp-bar" class="h-full bg-emerald-500 transition-all" style="width:100%"></div></div>
                <div class="flex justify-between mt-1 text-[7px] text-neutral-500"><span>VITAL_STATUS: ACTIVE</span><span id="hp-txt">100/100</span></div>
            </div>
            <div class="text-right">
                <div class="text-4xl font-black text-white leading-none" id="pa-display">4</div>
                <div class="text-[8px] text-emerald-500 font-bold uppercase">Action Units</div>
            </div>
        </header>

        <div class="d-pad">
            <div></div><button class="ctrl-btn" onclick="input('avanti')">▲</button><div></div>
            <button class="ctrl-btn" onclick="input('ruota_sx')">◀</button>
            <button class="ctrl-btn" onclick="input('indietro')">▼</button>
            <button class="ctrl-btn" onclick="input('ruota_dx')">▶</button>
        </div>

        <div class="action-btns">
            <button class="milit-btn" onclick="fruga()">Scansione</button>
            <button class="milit-btn primary" onclick="passaTurno()">Fine Turno</button>
        </div>
    </div>

    <script>
        // CONFIG FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDzCp1PWbf82SfvhpZyXViK0Klf8rgDOcc",
            databaseURL: "https://cryopunk-90f36-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "cryopunk-90f36",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const TEAM_DATA = {
            dave: { n: "DAVE-RIG", role: "INGEGNERE", color: 0x999999, hair: 0x000000, type: "slim" },
            jonny: { n: "JONNY DARK", role: "HACKER", color: 0x222222, hair: 0x000000, type: "slim" },
            ivan: { n: "IVAN-VOSTOK", role: "OPERATORE", color: 0x333333, hair: 0x5d4037, type: "massive" },
            sara: { n: "SARA-MED", role: "MEDICO", color: 0x444444, hair: 0x333333, type: "slim" },
            axel: { n: "AXEL-01", role: "SYNTH", color: 0x111111, hair: 0xcccccc, type: "android" }
        };

        let myId = null;
        let gameState = {};
        let scene, camera, renderer, charMeshes = {};
        let pa = 4;

        // --- 3D ENGINE TACTICAL ---
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020202);
            scene.fog = new THREE.FogExp2(0x020202, 0.02);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            document.body.appendChild(renderer.domElement);

            // Luci CoD Style
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.2);
            scene.add(hemiLight);
            
            const spotLight = new THREE.SpotLight(0x00ffaa, 1.5);
            spotLight.position.set(50, 100, 50);
            spotLight.angle = Math.PI / 6;
            scene.add(spotLight);

            // Pavimento Metallico
            const planeGeo = new THREE.PlaneGeometry(500, 500);
            const planeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.8 });
            const ground = new THREE.Mesh(planeGeo, planeMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Oggetti Scenici (Casse Tattiche)
            for(let i=0; i<30; i++){
                const box = new THREE.Mesh(new THREE.BoxGeometry(4,4,4), new THREE.MeshStandardMaterial({color:0x222222, metalness:0.9}));
                box.position.set(Math.random()*200-100, 2, Math.random()*200-100);
                scene.add(box);
            }

            // Personaggi Dettagliati
            Object.keys(TEAM_DATA).forEach(id => {
                const data = TEAM_DATA[id];
                const group = new THREE.Group();
                
                // Gambe
                const legGeo = new THREE.CylinderGeometry(0.4, 0.3, 2.5);
                const legL = new THREE.Mesh(legGeo, new THREE.MeshStandardMaterial({color:0x111111}));
                legL.position.set(-0.5, 1.25, 0); group.add(legL);
                const legR = legL.clone(); legR.position.x = 0.5; group.add(legR);

                // Torace (Massiccio per Ivan)
                const bodyW = (id === 'ivan') ? 1.8 : 1.2;
                const bodyGeo = new THREE.BoxGeometry(bodyW, 2.5, 0.8);
                const armor = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({color: data.color, metalness:0.8}));
                armor.position.y = 3.5; group.add(armor);

                // Testa + Capelli
                const headGeo = new THREE.SphereGeometry(0.5);
                const head = new THREE.Mesh(headGeo, new THREE.MeshStandardMaterial({color:0xffdbac}));
                head.position.y = 5.2; group.add(head);

                const hairGeo = new THREE.BoxGeometry(0.6, 0.2, 0.6);
                const hair = new THREE.Mesh(hairGeo, new THREE.MeshBasicMaterial({color: data.hair}));
                hair.position.y = 5.6; 
                if(id === 'ivan') hair.rotation.z = 0.4;
                group.add(hair);

                scene.add(group);
                charMeshes[id] = group;
                group.position.set(Math.random()*20-10, 0, Math.random()*20-10);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if(myId && charMeshes[myId]) {
                const p = charMeshes[myId].position;
                // Camera Tactical Shoulder-view
                camera.position.lerp(new THREE.Vector3(p.x, p.y + 12, p.z + 20), 0.1);
                camera.lookAt(p.x, p.y + 4, p.z);
            }
            renderer.render(scene, camera);
        }

        // --- FIREBASE SYNC & AUTO-RELEASE ---
        db.ref('game').on('value', (snap) => {
            gameState = snap.val();
            if(!gameState) initServer();
            else {
                if(!myId) updateSelection();
                else syncGame();
            }
        });

        function initServer() {
            const players = {};
            Object.keys(TEAM_DATA).forEach(k => players[k] = {x:0, z:0, r:0, s:'LIBERO', h:100});
            db.ref('game').set({ players });
        }

        function updateSelection() {
            const grid = document.getElementById('char-grid');
            grid.innerHTML = Object.keys(TEAM_DATA).map(k => {
                const occupied = gameState.players[k].s !== 'LIBERO';
                return `
                    <div class="milit-card ${occupied ? 'occupied' : ''}" onclick="pick('${k}')">
                        <div class="text-xs font-black text-white">${TEAM_DATA[k].n}</div>
                        <div class="text-[7px] text-emerald-500 font-bold">${TEAM_DATA[k].role}</div>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 text-[8px] font-black">${occupied ? '[ UNAUTHORIZED ]' : '[ READY ]'}</div>
                    </div>
                `;
            }).join('');
        }

        function pick(id) {
            myId = id;
            const ref = db.ref(`game/players/${id}`);
            ref.update({ s: 'OCCUPATO' });
            
            // AUTO-RELEASE: Quando chiudi la pagina, il personaggio torna LIBERO
            ref.onDisconnect().update({ s: 'LIBERO' });

            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('char-name').innerText = "UNIT: " + TEAM_DATA[id].n;
            init3D();
        }

        function syncGame() {
            Object.keys(gameState.players).forEach(id => {
                if(charMeshes[id]) {
                    const p = gameState.players[id];
                    charMeshes[id].position.x = p.x;
                    charMeshes[id].position.z = p.z;
                    charMeshes[id].rotation.y = p.r;
                }
            });
            document.getElementById('hp-bar').style.width = gameState.players[myId].h + "%";
            document.getElementById('hp-txt').innerText = gameState.players[myId].h + "/100";
        }

        // CONTROLLI
        function input(type) {
            if(pa < 0.2) return;
            const mesh = charMeshes[myId];
            if(type === 'avanti') mesh.translateZ(-2);
            if(type === 'indietro') mesh.translateZ(2);
            if(type === 'ruota_sx') mesh.rotation.y += 0.4;
            if(type === 'ruota_dx') mesh.rotation.y -= 0.4;
            
            pa -= 0.2;
            updateDB();
        }

        function updateDB() {
            document.getElementById('pa-display').innerText = Math.floor(pa);
            db.ref(`game/players/${myId}`).update({
                x: charMeshes[myId].position.x,
                z: charMeshes[myId].position.z,
                r: charMeshes[myId].rotation.y
            });
        }

        function passaTurno() {
            pa = 4;
            document.getElementById('pa-display').innerText = pa;
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
