<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CRIOPUNK - REVOLUTION</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap');
        
        :root { --primary: #00e5ff; --accent: #ff0033; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Share Tech Mono', monospace; color: white; }
        #game-canvas { position: fixed; inset: 0; z-index: 1; background: #000; }

        /* Schermata di selezione */
        .selection-screen {
            position: fixed; inset: 0; z-index: 100; 
            background: radial-gradient(circle at center, #0a1120 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .title-glow {
            font-family: 'Orbitron', sans-serif; font-size: clamp(3rem, 8vw, 5rem); font-weight: 900; 
            text-shadow: 0 0 30px var(--primary); font-style: italic; letter-spacing: 12px; color: #fff;
            margin-bottom: 40px;
        }

        .char-grid { display: grid; grid-template-cols: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 90%; max-width: 1000px; }
        .char-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 229, 255, 0.2);
            padding: 25px; border-radius: 20px; cursor: pointer; transition: 0.3s;
        }
        .char-card:hover { border-color: var(--primary); background: rgba(0, 229, 255, 0.15); transform: translateY(-5px); }
        .char-card.occupied { opacity: 0.3; filter: grayscale(1); pointer-events: none; }

        /* HUD Gioco */
        .ui-layer { position: relative; z-index: 50; pointer-events: none; height: 100vh; display: flex; flex-direction: column; padding: 20px; }
        .ui-layer * { pointer-events: auto; }
        .hp-bar { width: 200px; height: 10px; background: #222; border: 1px solid #444; border-radius: 5px; overflow: hidden; }
        #hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--accent), var(--primary)); }

        #joystick-zone { width: 120px; height: 120px; border: 2px solid var(--primary); border-radius: 50%; position: absolute; bottom: 30px; left: 30px; background: rgba(0,0,0,0.3); }
        #joystick-knob { width: 40px; height: 40px; background: var(--primary); border-radius: 50%; position: absolute; top: 40px; left: 40px; box-shadow: 0 0 15px var(--primary); }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="selection-screen" class="selection-screen">
        <div class="title-glow">CRIOPUNK</div>
        <div id="char-grid" class="char-grid">
            <!-- Davide -->
            <div class="char-card" onclick="selectChar('davide')">
                <div class="text-xl font-bold">DAVIDE</div>
                <div class="text-[10px] text-cyan-400 mt-1 uppercase tracking-tighter">Fisico Slanciato, Cappotto Grigio, Capelli Neri</div>
            </div>
            <!-- Ivan -->
            <div class="char-card" onclick="selectChar('ivan')">
                <div class="text-xl font-bold">IVAN</div>
                <div class="text-[10px] text-cyan-400 mt-1 uppercase tracking-tighter">Muscoloso, Fucile, Canottiera, Rasato ai lati</div>
            </div>
            <!-- Jonny -->
            <div class="char-card" onclick="selectChar('jonny')">
                <div class="text-xl font-bold">JONNY</div>
                <div class="text-[10px] text-cyan-400 mt-1 uppercase tracking-tighter">Felpa Nera, Cappuccio, Pantaloni Beige Larghi</div>
            </div>
        </div>
        <div class="text-[9px] text-white/30 mt-10 uppercase tracking-widest">Database: Europe-West1 Connected</div>
    </div>

    <div id="game-ui" class="ui-layer hidden">
        <div class="hp-bar"><div id="hp-fill"></div></div>
        <div class="text-[10px] text-cyan-400 mt-1">SISTEMA INTEGRITÀ</div>

        <div class="mt-auto flex flex-col gap-3">
            <div id="log" class="h-20 bg-black/50 p-2 text-[10px] rounded border border-white/5 overflow-y-auto"></div>
            <div class="flex gap-2">
                <button onclick="fruga()" class="flex-1 bg-white/10 p-3 rounded text-[10px] font-bold border border-white/10">CONSOLE</button>
                <button onclick="attacca()" class="flex-1 bg-red-600/20 p-3 rounded text-[10px] font-bold border border-red-500/50">FUOCO</button>
            </div>
            <div style="height: 140px;"></div>
        </div>
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDzCp1PWbf82SfvhpZyXViK0Klf8rgDOcc",
            authDomain: "cryopunk-90f36.firebaseapp.com",
            databaseURL: "https://cryopunk-90f36-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "cryopunk-90f36",
            storageBucket: "cryopunk-90f36.appspot.com",
            appId: "1:593721385474:web:193026f8d09ca086431940"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const ROOM_PATH = "criopunk_v3_stable";

        const TEAM = {
            davide: { n: "DAVIDE", slot: "p1" },
            ivan: { n: "IVAN", slot: "p2" },
            jonny: { n: "JONNY", slot: "p3" }
        };

        let scene, camera, renderer, localPlayerMesh, myId, mySlot, myPlayerRef;
        let remotePlayers = {};
        let joystickVector = { x: 0, y: 0 };
        const obstacles = [];

        // --- SELEZIONE PERSONAGGIO ---
        function selectChar(key) {
            myId = key;
            mySlot = TEAM[key].slot;
            
            // Prova a occupare lo slot su Firebase
            myPlayerRef = db.ref(`${ROOM_PATH}/${mySlot}`);
            myPlayerRef.set({ charKey: key, x: 0, z: 0, angle: 0, hp: 100 });
            myPlayerRef.onDisconnect().remove();

            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-ui').classList.remove('hidden');
            
            init3D();
        }

        // --- MOTORE 3D ---
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020305);
            scene.fog = new THREE.Fog(0x020305, 10, 50);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 15);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;

            // Luci
            const amb = new THREE.AmbientLight(0xffffff, 0.3); scene.add(amb);
            const spot = new THREE.PointLight(0x00e5ff, 2, 40); spot.position.set(0, 10, 0); scene.add(spot);
            const redL = new THREE.PointLight(0xff0033, 1, 30); redL.position.set(15, 5, -15); scene.add(redL);

            buildEnvironment();
            
            localPlayerMesh = createHumanMesh(myId);
            scene.add(localPlayerMesh);

            setupJoystick();
            animate();
            listenToFirebase();
        }

        function buildEnvironment() {
            // Pavimento
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshStandardMaterial({ color: 0x080808, metalness: 0.8, roughness: 0.2 }));
            floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9 });

            const addWall = (w, h, d, x, z) => {
                const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat);
                m.position.set(x, h/2, z); scene.add(m);
                obstacles.push(new THREE.Box3().setFromObject(m));
            };

            // Perimetro
            addWall(60, 15, 1, 0, -25); // Nord
            addWall(1, 15, 60, -25, 0); // Ovest
            addWall(1, 15, 60, 25, 0);  // Est

            // TUBI ALLE PARETI
            for(let i=0; i<3; i++) {
                const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 60, 12), new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 1 }));
                pipe.rotation.z = Math.PI/2; pipe.position.set(0, 2+i*3, -24.5);
                scene.add(pipe);
            }

            // MONITOR GIGANTI
            const createMonitor = (x, z) => {
                const group = new THREE.Group();
                const frame = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 0.5), new THREE.MeshStandardMaterial({ color: 0x000000 }));
                group.add(frame);
                
                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 128;
                const ctx = canvas.getContext('2d');
                const texture = new THREE.CanvasTexture(canvas);
                setInterval(() => {
                    ctx.fillStyle = '#000810'; ctx.fillRect(0,0,256,128);
                    ctx.strokeStyle = '#00e5ff'; ctx.strokeRect(5,5,246,118);
                    ctx.fillStyle = '#00e5ff'; ctx.font = '12px monospace';
                    ctx.fillText("COORD-X: " + Math.random().toFixed(4), 15, 30);
                    ctx.fillText("COORD-Y: " + Math.random().toFixed(4), 15, 50);
                    ctx.fillText("ROUTE: STABLE", 15, 70);
                    texture.needsUpdate = true;
                }, 200);

                const screen = new THREE.Mesh(new THREE.PlaneGeometry(7.6, 4.6), new THREE.MeshBasicMaterial({ map: texture }));
                screen.position.z = 0.3; group.add(screen);
                group.position.set(x, 4, z);
                scene.add(group);
                obstacles.push(new THREE.Box3().setFromObject(frame));
            };
            createMonitor(-10, -24.3);
            createMonitor(10, -24.3);
        }

        function createHumanMesh(id) {
            const group = new THREE.Group();
            const skin = new THREE.MeshStandardMaterial({ color: 0xdbac98 });
            
            // Corpo e Gambe
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.35), new THREE.MeshStandardMaterial());
            body.position.y = 1.1; group.add(body);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), skin);
            head.position.y = 2.0; group.add(head);

            if (id === 'davide') {
                // Davide: Cappotto grigio, slanciato, capelli neri
                body.material.color.set(0x333333); // Grigio scuro
                body.scale.set(1, 1.3, 1);
                const hair = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.1, 0.3), new THREE.MeshStandardMaterial({ color: 0x000000 }));
                hair.position.y = 2.25; group.add(hair);
                const pants = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.36), new THREE.MeshStandardMaterial({ color: 0x4b3621 }));
                pants.position.y = 0.4; group.add(pants);
            } 
            else if (id === 'ivan') {
                // Ivan: Muscoloso, canottiera bianca, mimetico, fucile
                body.material.color.set(0xffffff); // Bianca
                body.scale.set(1.4, 1.1, 1.3); // Più largo/muscoloso
                const pants = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.4), new THREE.MeshStandardMaterial({ color: 0x1e3a1e }));
                pants.position.y = 0.4; group.add(pants);
                const hair = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, 0.3), new THREE.MeshStandardMaterial({ color: 0x4b3621 }));
                hair.position.set(0, 2.25, 0); group.add(hair);
                // Fucile
                const gun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 1.4), new THREE.MeshStandardMaterial({ color: 0x000000 }));
                gun.position.set(0.6, 1.4, 0.4); group.add(gun);
            }
            else if (id === 'jonny') {
                // Jonny: Felpa nera, cappuccio, pantaloni beige larghi
                body.material.color.set(0x000000); 
                const hood = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8, 0, Math.PI*2, 0, Math.PI/1.6), body.material);
                hood.position.y = 1.95; group.add(hood);
                const pants = new THREE.Mesh(new THREE.BoxGeometry(1, 0.8, 0.5), new THREE.MeshStandardMaterial({ color: 0xd2b48c }));
                pants.position.y = 0.4; group.add(pants);
            }
            group.castShadow = true;
            return group;
        }

        // --- ANIMAZIONE E FISICA ---
        function animate() {
            requestAnimationFrame(animate);

            if (localPlayerMesh) {
                const prevPos = localPlayerMesh.position.clone();
                if (Math.abs(joystickVector.x) > 0.1 || Math.abs(joystickVector.y) > 0.1) {
                    const moveX = joystickVector.x * 0.22;
                    const moveZ = joystickVector.y * 0.22;
                    
                    localPlayerMesh.position.x += moveX;
                    localPlayerMesh.position.z += moveZ;
                    localPlayerMesh.rotation.y = Math.atan2(moveX, moveZ);

                    // COLLISIONI
                    const pBox = new THREE.Box3().setFromObject(localPlayerMesh);
                    let hit = false;
                    for(let col of obstacles) { if(pBox.intersectsBox(col)) hit = true; }
                    if(hit) localPlayerMesh.position.copy(prevPos);

                    myPlayerRef.update({ x: localPlayerMesh.position.x, z: localPlayerMesh.position.z, angle: localPlayerMesh.rotation.y });
                }
            }

            Object.values(remotePlayers).forEach(p => {
                p.mesh.position.lerp(p.target, 0.2);
                p.mesh.rotation.y = THREE.MathUtils.lerp(p.mesh.rotation.y, p.tAngle, 0.2);
            });

            renderer.render(scene, camera);
        }

        function listenToFirebase() {
            db.ref(ROOM_PATH).on('value', snap => {
                const state = snap.val() || {};
                Object.keys(state).forEach(s => {
                    if (s !== mySlot) {
                        if (!remotePlayers[s]) {
                            const m = createHumanMesh(state[s].charKey);
                            scene.add(m);
                            remotePlayers[s] = { mesh: m, target: new THREE.Vector3(), tAngle: 0 };
                        }
                        remotePlayers[s].target.set(state[s].x, 0, state[s].z);
                        remotePlayers[s].tAngle = state[s].angle;
                    }
                });
            });
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const handle = (e) => {
                const t = e.touches ? e.touches[0] : e;
                const r = zone.getBoundingClientRect();
                const dx = t.clientX - (r.left + 60);
                const dy = t.clientY - (r.top + 60);
                const d = Math.min(Math.hypot(dx,dy), 40);
                const a = Math.atan2(dy,dx);
                knob.style.transform = `translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px)`;
                joystickVector = { x: (Math.cos(a)*d)/40, y: (Math.sin(a)*d)/40 };
            };
            zone.addEventListener('touchstart', e => e.preventDefault());
            window.addEventListener('touchmove', handle);
            window.addEventListener('mousemove', e => { if(e.buttons) handle(e); });
            window.addEventListener('touchend', () => { joystickVector = {x:0, y:0}; knob.style.transform = ''; });
            window.addEventListener('mouseup', () => { joystickVector = {x:0, y:0}; knob.style.transform = ''; });
        }

        function fruga() { loggar("Accesso ai terminali Criopunk..."); }
        function attacca() { loggar("Arma attivata."); }
        function loggar(m) { 
            const l = document.getElementById('log');
            l.innerHTML = `<div>[${myId.toUpperCase()}]: ${m}</div>` + l.innerHTML;
        }

    </script>
</body>
</html>
