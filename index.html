<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CRYOPUNK: GOLGOTHA-IV 3D CO-OP SURVIVAL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        :root {
            --primary: #bc6ff1;
            --accent: #00d4ff;
            --danger: #ff2e63;
            --bg-glass: rgba(10, 5, 25, 0.88);
            --border-glass: rgba(188, 111, 241, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Share Tech Mono', monospace;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030106;
            color: #e5e5e5;
        }

        #game-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
        }

        .ui-layer * {
            pointer-events: auto;
        }

        .cyber-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: 4px solid var(--primary);
            border-radius: 0 18px 18px 0;
            border: 1px solid var(--border-glass);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .selection-screen {
            position: fixed;
            inset: 0;
            z-index: 500;
            background: #030106;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
        }

        .char-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(15, 10, 30, 0.7);
            cursor: pointer;
        }

        .char-card.occupied {
            opacity: 0.35;
            filter: grayscale(0.8);
            pointer-events: none;
            border-color: rgba(255, 0, 0, 0.2);
        }

        .char-card:not(.occupied):hover, .char-card:not(.occupied):active {
            border-color: var(--primary);
            background: rgba(188, 111, 241, 0.15);
            transform: translateY(-2px);
        }

        .btn-home {
            background: linear-gradient(135deg, #ff2e63 0%, #ff4b2b 100%);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            font-weight: 900;
            font-size: 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 46, 99, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-home:active {
            transform: scale(0.95);
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: rgba(188, 111, 241, 0.2);
            border-color: var(--primary);
        }

        .btn-danger {
            background: rgba(255, 46, 99, 0.2);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: rgba(255, 46, 99, 0.4);
        }

        .controls-layer {
            position: relative;
            width: 100%;
            height: 180px;
            pointer-events: none;
        }

        #joystick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(188, 111, 241, 0.3);
            border-radius: 50%;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary);
            transform: translate(0px, 0px);
            transition: transform 0.05s ease-out;
            pointer-events: none;
        }

        .hp-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .hp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff2e63, #10b981);
            width: 100%;
            transition: width 0.3s ease;
        }

        #status-overlay {
            position: fixed;
            inset: 0;
            z-index: 600;
            background: rgba(3, 1, 6, 0.95);
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="selection-screen" class="selection-screen">
        <h1 class="text-purple-400 text-3xl font-black italic mb-1 tracking-tight">CRYOPUNK: GOLGOTHA-IV</h1>
        <p class="text-neutral-500 text-[10px] mb-6 uppercase tracking-[0.3em]">Scegli il tuo sopravvissuto per accedere alla nave...</p>
        <div id="char-grid" class="grid grid-cols-1 gap-3 max-w-md w-full mx-auto"></div>
    </div>

    <div id="game-ui" class="ui-layer hidden">
        <header class="flex justify-between items-center bg-neutral-900/90 p-4 rounded-2xl border border-white/10 mb-2">
            <div class="flex items-center gap-3">
                <div id="slot-dot" class="w-3.5 h-3.5 rounded-full"></div>
                <div>
                    <div id="my-tag" class="text-xs font-black text-purple-400 uppercase italic">---</div>
                    <div class="text-[8px] text-neutral-400 uppercase tracking-widest">Nave Spaziale (<span id="online-count">1</span>/4 EQUIPAGGIO)</div>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right w-24">
                    <div class="flex justify-between text-[8px] text-neutral-400 font-bold mb-1">
                        <span>SALUTE HP</span>
                        <span id="hp-val">100</span>
                    </div>
                    <div class="hp-bar-bg"><div id="hp-fill" class="hp-bar-fill"></div></div>
                </div>
                <button class="btn-home" onclick="leaveRoomAndGoHome()">Home</button>
            </div>
        </header>

        <main class="flex-1 flex flex-col justify-end space-y-2">
            <div id="hazard-alert" class="bg-red-600/90 text-white text-center py-1.5 text-[10px] font-black tracking-widest hidden rounded-lg animate-pulse">
                ⚠️ XENOMORFO RILEVATO NEL SETTORE!
            </div>

            <section class="cyber-panel p-4">
                <div class="flex justify-between items-start mb-1">
                    <h2 id="room-name" class="text-sm font-black text-white uppercase tracking-tighter">Cripta Criogenica</h2>
                    <div class="text-[9px] text-amber-400 font-bold">KEYCARDS: <span id="keys-count">0</span>/3</div>
                </div>
                <p id="room-desc" class="text-[9px] text-neutral-400 italic mb-3">Settore di stasi Golgotha-IV</p>

                <div id="actions" class="grid grid-cols-2 gap-2">
                    <button onclick="fruga()" class="btn-action">🔍 Analisi Settore</button>
                    <button onclick="attacca()" id="btn-atk" class="btn-action btn-danger hidden">⚔️ Respingi Alieno</button>
                    <button onclick="evacua()" id="btn-escape" class="btn-action bg-emerald-600/30 border-emerald-500 text-emerald-400 hidden col-span-2">🚀 EVACUA ASTRONAVE</button>
                </div>
            </section>

            <div id="log" class="h-20 bg-black/80 rounded-xl p-3 overflow-y-auto text-[8px] font-mono border border-white/5 space-y-1"></div>

            <div class="controls-layer">
                <div id="joystick-zone">
                    <div id="joystick-knob"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="status-overlay" class="hidden">
        <div class="bg-neutral-900/90 border border-purple-500/30 rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
            <div id="overlay-title" class="text-2xl font-black text-purple-400 mb-2">---</div>
            <div id="overlay-desc" class="text-xs text-neutral-400 mb-6">---</div>
            <button id="overlay-btn" class="btn-home w-full py-3" onclick="leaveRoomAndGoHome()">Torna alla Home</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        let db = null;
        let isFirebaseAvailable = false;

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                isFirebaseAvailable = true;
            }
        } catch (e) {
            console.warn("Firebase offline. Modalità locale attiverà l'esperienza 3D.", e);
        }

        const ROOM_PATH = "active_sessions/rooms/lobby_1";

        const TEAM_DATA = {
            ivan: { n: "IVAN-VOSTOK", role: "Soldato Tattico", color: "#ff2e63", num: 0xff2e63, catch: "Armi pronte. Nessun alieno passerà.", slot: "player1" },
            dave: { n: "DAVE-RIG", role: "Ingegnere", color: "#fbbf24", num: 0xfbbf24, catch: "Sistemi nave sotto controllo.", slot: "player2" },
            jonny: { n: "JONNY DARK", role: "Hacker Cyber", color: "#bc6ff1", num: 0xbc6ff1, catch: "Bypasso i blocchi della sicurezza...", slot: "player3" },
            sara: { n: "SARA-MED", role: "Biologa", color: "#10b981", num: 0x10b981, catch: "Sensori biologici attivi.", slot: "player4" }
        };

        const SECTORS = {
            cryo: { n: "Cripta Criogenica", d: "Capsule di stasi 01-04.", pos: {x: 0, z: 0} },
            armory: { n: "Armeria Vostok", d: "Rastrelliere d'armi e munizioni.", pos: {x: -25, z: -25}, keycard: true },
            datanode: { n: "Nodo Dati", d: "Terminali olografici di bordo.", pos: {x: 25, z: -25}, keycard: true },
            reactor: { n: "Reattore Fuga", d: "Nucleo a fusione principale.", pos: {x: 25, z: 25}, keycard: true },
            escape: { n: "Pod di Salvataggio", d: "Navetta d'evacuazione d'emergenza.", pos: {x: -25, z: 25}, pod: true }
        };

        let myId = null;
        let mySlot = null;
        let myPlayerRef = null;
        let myClientId = 'cli_' + Math.random().toString(36).substr(2, 9);
        let roomState = {};

        let playerHP = 100;
        let collectedKeycards = new Set();
        let alienSector = 'reactor';

        let scene, camera, renderer, controls;
        let localPlayerMesh = null;
        let alienMesh = null;
        const remotePlayers = {};
        let lastSyncTime = 0;

        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickVector = { x: 0, y: 0 };
        let joystickActive = false;
        let touchId = null;

        function initApp() {
            updateCharacterSelectionScreen();

            if (isFirebaseAvailable && db) {
                const roomRef = db.ref(ROOM_PATH);
                roomRef.on('value', (snapshot) => {
                    roomState = snapshot.val() || {};
                    updateCharacterSelectionScreen();
                    syncRoomUI();
                });
            }
        }

        function updateCharacterSelectionScreen() {
            const grid = document.getElementById('char-grid');
            if (!grid) return;

            grid.innerHTML = Object.keys(TEAM_DATA).map(charKey => {
                const char = TEAM_DATA[charKey];
                const slotData = roomState[char.slot];
                const occupied = !!slotData;

                return `
                    <div class="char-card p-4 rounded-xl flex justify-between items-center ${occupied ? 'occupied' : ''}" onclick="selectCharacter('${charKey}')">
                        <div class="flex items-center gap-3">
                            <div class="w-3.5 h-3.5 rounded-full" style="background-color: ${char.color}; box-shadow: 0 0 8px ${char.color}"></div>
                            <div>
                                <div class="text-white font-bold text-sm tracking-wide">${char.n}</div>
                                <div class="text-[9px] text-neutral-400">${char.role}</div>
                            </div>
                        </div>
                        <div class="text-[9px] font-black ${occupied ? 'text-red-500' : 'text-emerald-400'}">
                            ${occupied ? 'IN USO' : 'SELEZIONA'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectCharacter(charKey) {
            const targetChar = TEAM_DATA[charKey];
            const targetSlot = targetChar.slot;

            if (isFirebaseAvailable && db) {
                const roomRef = db.ref(ROOM_PATH);
                roomRef.transaction((data) => {
                    if (data === null) data = {};
                    if (data[targetSlot]) return;

                    data[targetSlot] = {
                        token: myClientId,
                        charKey: charKey,
                        x: 0, z: 0, angle: 0,
                        updatedAt: firebase.database.ServerValue.TIMESTAMP
                    };
                    return data;
                }, (error, committed, snapshot) => {
                    if (error || !committed) {
                        showOverlayError("Slot Occupato", "Personaggio già in uso da un altro membro.");
                        return;
                    }
                    enterGame(charKey, targetSlot);
                });
            } else {
                enterGame(charKey, targetSlot);
            }
        }

        function enterGame(charKey, targetSlot) {
            myId = charKey;
            mySlot = targetSlot;

            if (isFirebaseAvailable && db) {
                myPlayerRef = db.ref(`${ROOM_PATH}/${mySlot}`);
                myPlayerRef.onDisconnect().remove();
            }

            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('my-tag').innerText = TEAM_DATA[charKey].n;
            document.getElementById('slot-dot').style.backgroundColor = TEAM_DATA[charKey].color;

            loggar(TEAM_DATA[charKey].catch, charKey);
            init3D();
        }

        function init3D() {
            const canvas = document.getElementById('game-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x030106);
            scene.fog = new THREE.FogExp2(0x030106, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 14);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            const ambient = new THREE.AmbientLight(0x221535, 0.7);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xbc6ff1, 0.8);
            dirLight.position.set(20, 35, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const floorGeo = new THREE.PlaneGeometry(80, 80);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x080414, roughness: 0.4, metalness: 0.5 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(80, 40, 0xbc6ff1, 0x180a30);
            grid.position.y = 0.01;
            scene.add(grid);

            buildShipEnvironment();

            localPlayerMesh = createHumanoidPlayerMesh(myId);
            localPlayerMesh.position.set(0, 0, 0);
            scene.add(localPlayerMesh);

            alienMesh = createAlienMesh();
            const alienPos = SECTORS[alienSector].pos;
            alienMesh.position.set(alienPos.x, 0, alienPos.z);
            scene.add(alienMesh);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enablePan = false;
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;
            controls.minDistance = 5;
            controls.maxDistance = 22;
            controls.target.copy(localPlayerMesh.position);

            window.addEventListener('resize', onWindowResize);
            setupJoystick();
            requestAnimationFrame(animate);

            setInterval(moveAlienAI, 12000);
        }

        function buildShipEnvironment() {
            for (let i = 0; i < 4; i++) {
                const podGeo = new THREE.CylinderGeometry(0.7, 0.7, 2.4, 16);
                const podMat = new THREE.MeshStandardMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.6, emissive: 0x00d4ff, emissiveIntensity: 0.3 });
                const pod = new THREE.Mesh(podGeo, podMat);
                const angle = (i / 4) * Math.PI * 2;
                pod.position.set(Math.cos(angle) * 4, 1.2, Math.sin(angle) * 4);
                scene.add(pod);
            }

            const escapeGeo = new THREE.ConeGeometry(2.5, 4, 6);
            const escapeMat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.2, metalness: 0.8 });
            const escapePod = new THREE.Mesh(escapeGeo, escapeMat);
            escapePod.position.set(-25, 2, 25);
            scene.add(escapePod);

            const reactorGeo = new THREE.CylinderGeometry(2, 2, 6, 16);
            const reactorMat = new THREE.MeshStandardMaterial({ color: 0xff2e63, emissive: 0xff2e63, emissiveIntensity: 0.8 });
            const reactor = new THREE.Mesh(reactorGeo, reactorMat);
            reactor.position.set(25, 3, 25);
            scene.add(reactor);
        }

        function createHumanoidPlayerMesh(charKey) {
            const group = new THREE.Group();
            const char = TEAM_DATA[charKey] || TEAM_DATA.ivan;

            const torsoGeo = new THREE.BoxGeometry(0.7, 1.0, 0.4);
            const torsoMat = new THREE.MeshStandardMaterial({ color: char.num, roughness: 0.3, metalness: 0.6 });
            const torso = new THREE.Mesh(torsoGeo, torsoMat);
            torso.position.y = 1.3;
            torso.castShadow = true;
            group.add(torso);

            const headGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, roughness: 0.5 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.0;
            group.add(head);

            const visorGeo = new THREE.BoxGeometry(0.4, 0.15, 0.25);
            const visorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: char.num, emissiveIntensity: 0.9 });
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.position.set(0, 2.0, 0.2);
            group.add(visor);

            const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.8);
            const armMat = new THREE.MeshStandardMaterial({ color: 0x1f293d });
            
            const leftArm = new THREE.Mesh(armGeo, armMat);
            leftArm.position.set(-0.5, 1.3, 0);
            group.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, armMat);
            rightArm.position.set(0.5, 1.3, 0);
            group.add(rightArm);

            const legGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.9);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x111827 });

            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-0.25, 0.45, 0);
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(0.25, 0.45, 0);
            group.add(rightLeg);

            if (charKey === 'ivan') {
                const shoulderGeo = new THREE.BoxGeometry(1.1, 0.25, 0.5);
                const shoulder = new THREE.Mesh(shoulderGeo, new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9 }));
                shoulder.position.set(0, 1.7, 0);
                group.add(shoulder);
            } else if (charKey === 'dave') {
                const packGeo = new THREE.BoxGeometry(0.6, 0.7, 0.3);
                const pack = new THREE.Mesh(packGeo, new THREE.MeshStandardMaterial({ color: 0xfbbf24 }));
                pack.position.set(0, 1.3, -0.3);
                group.add(pack);
            } else if (charKey === 'jonny') {
                const cowlGeo = new THREE.ConeGeometry(0.35, 0.4, 4);
                const cowl = new THREE.Mesh(cowlGeo, new THREE.MeshStandardMaterial({ color: 0x18181b }));
                cowl.position.set(0, 2.25, -0.05);
                cowl.rotation.x = -0.2;
                group.add(cowl);
            } else if (charKey === 'sara') {
                const scaGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.5);
                const sca = new THREE.Mesh(scaGeo, new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x10b981 }));
                sca.position.set(0, 2.2, 0);
                group.add(sca);
            }

            return group;
        }

        function createAlienMesh() {
            const group = new THREE.Group();

            const bodyGeo = new THREE.SphereGeometry(0.9, 16, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0a0014, roughness: 0.1, metalness: 0.9 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.0;
            group.add(body);

            const coreGeo = new THREE.SphereGeometry(0.4, 12, 12);
            const coreMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 1.5 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.position.y = 1.0;
            group.add(core);

            for (let i = 0; i < 6; i++) {
                const legGeo = new THREE.CylinderGeometry(0.05, 0.02, 1.4);
                const legMat = new THREE.MeshStandardMaterial({ color: 0x1a002b });
                const leg = new THREE.Mesh(legGeo, legMat);
                const angle = (i / 6) * Math.PI * 2;
                leg.position.set(Math.cos(angle) * 0.9, 0.6, Math.sin(angle) * 0.9);
                leg.rotation.z = Math.cos(angle) * 0.6;
                leg.rotation.x = Math.sin(angle) * 0.6;
                group.add(leg);
            }

            return group;
        }

        function moveAlienAI() {
            const sectorKeys = Object.keys(SECTORS);
            alienSector = sectorKeys[Math.floor(Math.random() * sectorKeys.length)];
            const targetPos = SECTORS[alienSector].pos;

            if (alienMesh) {
                alienMesh.position.set(targetPos.x, 0, targetPos.z);
            }

            checkAlienHazard();
        }

        function getCurrentSectorKey(pos) {
            let closestKey = 'cryo';
            let minDist = Infinity;
            Object.keys(SECTORS).forEach(k => {
                const sp = SECTORS[k].pos;
                const dist = Math.hypot(pos.x - sp.x, pos.z - sp.z);
                if (dist < minDist) {
                    minDist = dist;
                    closestKey = k;
                }
            });
            return closestKey;
        }

        function checkAlienHazard() {
            if (!localPlayerMesh) return;
            const currentSector = getCurrentSectorKey(localPlayerMesh.position);

            document.getElementById('room-name').innerText = SECTORS[currentSector].n;
            document.getElementById('room-desc').innerText = SECTORS[currentSector].d;

            const isAlienHere = (currentSector === alienSector);
            document.getElementById('hazard-alert').classList.toggle('hidden', !isAlienHere);
            document.getElementById('btn-atk').classList.toggle('hidden', !isAlienHere);

            const hasAllKeys = (collectedKeycards.size >= 3);
            const isAtEscape = (currentSector === 'escape');
            document.getElementById('btn-escape').classList.toggle('hidden', !(hasAllKeys && isAtEscape));

            if (isAlienHere) {
                damagePlayer(15);
            }
        }

        function damagePlayer(amount) {
            playerHP = Math.max(0, playerHP - amount);
            document.getElementById('hp-val').innerText = playerHP;
            document.getElementById('hp-fill').style.width = `${playerHP}%`;

            if (playerHP <= 0) {
                showOverlayError("SCONFITTA", "Sei stato sopraffatto dallo xenomorfo alieno.");
            }
        }

        function fruga() {
            if (!localPlayerMesh) return;
            const currentSector = getCurrentSectorKey(localPlayerMesh.position);
            const sec = SECTORS[currentSector];

            if (sec.keycard && !collectedKeycards.has(currentSector)) {
                collectedKeycards.add(currentSector);
                document.getElementById('keys-count').innerText = collectedKeycards.size;
                loggar(`Trovata Keycard di Sicurezza nel settore ${sec.n}!`, myId);
            } else {
                loggar(`Analisi del settore ${sec.n} completata. Nessun oggetto utile trovato.`, myId);
            }
        }

        function attacca() {
            loggar(`Attacco sferrato allo xenomorfo! L'alieno è fuggito in un altro settore.`, myId);
            moveAlienAI();
        }

        function evacua() {
            if (collectedKeycards.size >= 3) {
                showOverlayError("VITTORIA!", "Evacuazione completata con successo! L'equipaggio è in salvo.");
            }
        }

        function setupJoystick() {
            const maxRadius = 45;

            function handleStart(e) {
                if (touchId !== null) return;
                const touch = e.changedTouches ? e.changedTouches[0] : e;
                touchId = touch.identifier !== undefined ? touch.identifier : 'mouse';
                joystickActive = true;
                handleMove(e);
            }

            function handleMove(e) {
                if (!joystickActive) return;
                let touch = null;
                if (e.changedTouches) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchId) {
                            touch = e.changedTouches[i];
                            break;
                        }
                    }
                } else if (touchId === 'mouse') {
                    touch = e;
                }
                if (!touch) return;

                const rect = joystickZone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                let dist = Math.hypot(dx, dy);

                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickVector.x = dx / maxRadius;
                joystickVector.y = dy / maxRadius;
            }

            function handleEnd(e) {
                if (!joystickActive) return;
                if (e.changedTouches) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchId) {
                            resetJoystick();
                            break;
                        }
                    }
                } else if (touchId === 'mouse') {
                    resetJoystick();
                }
            }

            function resetJoystick() {
                joystickActive = false;
                touchId = null;
                joystickVector = { x: 0, y: 0 };
                joystickKnob.style.transform = `translate(0px, 0px)`;
            }

            joystickZone.addEventListener('touchstart', handleStart, { passive: false });
            window.addEventListener('touchmove', handleMove, { passive: false });
            window.addEventListener('touchend', handleEnd, { passive: false });
            window.addEventListener('touchcancel', handleEnd, { passive: false });

            joystickZone.addEventListener('mousedown', handleStart);
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (localPlayerMesh) {
                if (Math.abs(joystickVector.x) > 0.05 || Math.abs(joystickVector.y) > 0.05) {
                    const forward = new THREE.Vector3();
                    camera.getWorldDirection(forward);
                    forward.y = 0;
                    forward.normalize();

                    const right = new THREE.Vector3();
                    right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).negate();

                    const moveDir = new THREE.Vector3()
                        .addScaledVector(forward, -joystickVector.y)
                        .addScaledVector(right, joystickVector.x);

                    if (moveDir.lengthSq() > 0.01) {
                        moveDir.normalize();
                        const speed = 0.15;
                        localPlayerMesh.position.addScaledVector(moveDir, speed);

                        const targetAngle = Math.atan2(moveDir.x, moveDir.z);
                        localPlayerMesh.rotation.y = THREE.MathUtils.lerp(localPlayerMesh.rotation.y, targetAngle, 0.2);

                        checkAlienHazard();
                        syncLocalMovement();
                    }
                }

                const prevTarget = controls.target.clone();
                controls.target.copy(localPlayerMesh.position);
                camera.position.add(controls.target.clone().sub(prevTarget));
            }

            if (alienMesh) {
                alienMesh.rotation.y += 0.02;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function syncLocalMovement() {
            if (!isFirebaseAvailable || !myPlayerRef || !localPlayerMesh) return;
            const now = Date.now();
            if (now - lastSyncTime > 40) {
                lastSyncTime = now;
                myPlayerRef.update({
                    x: localPlayerMesh.position.x,
                    z: localPlayerMesh.position.z,
                    angle: localPlayerMesh.rotation.y,
                    updatedAt: firebase.database.ServerValue.TIMESTAMP
                });
            }
        }

        function syncRoomUI() {
            const activeCount = Object.keys(roomState).length || 1;
            const onlineCountEl = document.getElementById('online-count');
            if (onlineCountEl) onlineCountEl.innerText = activeCount;
        }

        async function leaveRoomAndGoHome() {
            if (myPlayerRef) {
                await myPlayerRef.remove();
            }
            window.location.href = 'index_home.html';
        }

        function loggar(m, speaker) {
            const b = document.getElementById('log');
            if (!b) return;
            const char = TEAM_DATA[speaker] || { n: "SISTEMA NAVE", color: "#888" };
            b.innerHTML = `<div style="border-left:2px solid ${char.color}; padding-left:6px;"><span style="color:${char.color}">${char.n}:</span> "${m}"</div>` + b.innerHTML;
        }

        function showOverlayError(title, desc) {
            document.getElementById('overlay-title').innerText = title;
            document.getElementById('overlay-desc').innerText = desc;
            document.getElementById('status-overlay').classList.remove('hidden');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
