<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CRIOPUNK - REVOLUTION</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Post-Processing per bagliore e realismo -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap');
        
        :root { --primary: #00e5ff; --accent: #ff0033; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Share Tech Mono', monospace; color: white; }
        #game-canvas { position: fixed; inset: 0; z-index: 1; }

        /* Schermata Titolo Criopunk */
        .selection-screen {
            position: fixed; inset: 0; z-index: 100; 
            background: radial-gradient(circle at center, #0a1120 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .title-glow {
            font-family: 'Orbitron', sans-serif; font-size: clamp(3rem, 10vw, 6rem); font-weight: 900; 
            text-shadow: 0 0 30px var(--primary); font-style: italic; letter-spacing: 15px; color: #fff;
        }

        .char-grid { display: grid; grid-template-cols: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; width: 90%; max-width: 1000px; margin-top: 50px; }
        .char-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            padding: 30px; border-radius: 20px; cursor: pointer; transition: 0.4s; text-align: center;
        }
        .char-card:hover { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); transform: translateY(-5px); }
        .char-card.occupied { opacity: 0.2; filter: grayscale(1); pointer-events: none; }

        /* HUD Gioco */
        .ui-layer { position: relative; z-index: 10; pointer-events: none; height: 100vh; display: flex; flex-direction: column; padding: 25px; }
        .ui-layer * { pointer-events: auto; }
        .hp-bar { width: 250px; height: 10px; background: rgba(255,0,0,0.2); border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; }
        #hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--accent), var(--primary)); transition: 0.5s ease; }

        #joystick-zone { width: 140px; height: 140px; border: 2px solid var(--primary); border-radius: 50%; position: absolute; bottom: 50px; left: 50px; background: rgba(0,229,255,0.05); backdrop-filter: blur(8px); }
        #joystick-knob { width: 50px; height: 50px; background: var(--primary); border-radius: 50%; position: absolute; top: 45px; left: 45px; box-shadow: 0 0 25px var(--primary); }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <!-- SCHERMATA START -->
    <div id="selection-screen" class="selection-screen">
        <div class="title-glow">CRIOPUNK</div>
        <div class="text-cyan-400 tracking-[0.8em] text-xs uppercase mt-4">Advanced Tactical Sector</div>
        <div id="char-grid" class="char-grid"></div>
    </div>

    <!-- INTERFACCIA HUD -->
    <div id="game-ui" class="ui-layer hidden">
        <div class="flex justify-between items-start">
            <div>
                <div class="text-[10px] text-cyan-400 font-bold mb-1 tracking-widest">SISTEMI ARMATURA</div>
                <div class="hp-bar"><div id="hp-fill"></div></div>
            </div>
            <div id="room-info" class="text-[9px] text-right text-white/50 uppercase tracking-tighter">
                Settore: Cryo-90F36<br>Stato: Online
            </div>
        </div>

        <div class="mt-auto flex flex-col gap-4">
            <div id="log" class="h-24 overflow-y-auto bg-black/40 p-3 rounded-lg border border-white/5 text-[10px] text-neutral-400"></div>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="fruga()" class="bg-white/5 border border-white/20 p-4 rounded-xl font-bold text-[10px] hover:bg-white/10">CONSOLE / AZIONE</button>
                <button onclick="attacca()" class="bg-red-600/20 border border-red-500/50 p-4 rounded-xl font-bold text-[10px] hover:bg-red-600/40">FUOCO BLASTER</button>
            </div>
            <div style="height: 180px;"></div>
        </div>

        <div id="joystick-zone"><div id="joystick-knob"></div></div>
    </div>

    <script>
        // CONFIGURAZIONE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDzCp1PWbf82SfvhpZyXViK0Klf8rgDOcc",
            authDomain: "cryopunk-90f36.firebaseapp.com",
            databaseURL: "https://cryopunk-90f36-default-rtdb.firebaseio.com",
            projectId: "cryopunk-90f36",
            storageBucket: "cryopunk-90f36.appspot.com",
            messagingSenderId: "593721385474",
            appId: "1:593721385474:web:193026f8d09ca086431940" 
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const ROOM_PATH = "criopunk_realistic_v1";

        const TEAM = {
            davide: { n: "DAVIDE", desc: "Cappotto lungo, slanciato", color: "#4b5563", slot: "p1" },
            ivan: { n: "IVAN", desc: "Muscoloso, Fucile, Mimetico", color: "#166534", slot: "p2" },
            jonny: { n: "JONNY", desc: "Hoodie Nero, Oversize", color: "#111827", slot: "p3" }
        };

        let scene, camera, renderer, composer, localPlayerMesh, doorMesh;
        let myId, mySlot, myPlayerRef;
        let remotePlayers = {};
        let joystickVector = { x: 0, y: 0 };
        const colliders = []; // Per le collisioni

        function initApp() {
            const grid = document.getElementById('char-grid');
            db.ref(ROOM_PATH).on('value', snap => {
                const state = snap.val() || {};
                grid.innerHTML = Object.keys(TEAM).map(k => {
                    const char = TEAM[k];
                    const occ = !!state[char.slot];
                    return `
                        <div class="char-card ${occ ? 'occupied' : ''}" onclick="selectChar('${k}')">
                            <div class="text-2xl font-black text-white">${char.n}</div>
                            <div class="text-[10px] text-cyan-400 uppercase mt-1 mb-4">${char.desc}</div>
                            <div class="text-[9px] ${occ ? 'text-red-500' : 'text-green-400'} font-bold">
                                ${occ ? 'UNITÀ IN MISSIONE' : 'PRONTO AL DEPLOY'}
                            </div>
                        </div>
                    `;
                }).join('');
                syncRemoteState(state);
            });
        }

        function selectChar(key) {
            const slot = TEAM[key].slot;
            db.ref(`${ROOM_PATH}/${slot}`).transaction(curr => {
                if (curr) return;
                return { charKey: key, x: 0, z: 0, angle: 0, hp: 100 };
            }, (err, ok) => { if (ok) startGame(key, slot); });
        }

        function startGame(key, slot) {
            myId = key; mySlot = slot;
            myPlayerRef = db.ref(`${ROOM_PATH}/${mySlot}`);
            myPlayerRef.onDisconnect().remove();
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-ui').classList.remove('hidden');
            init3D();
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010205, 0.04);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 25);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.shadowMap.enabled = true;

            // BLOOM EFFECTS
            const renderScene = new THREE.RenderPass(scene, camera);
            const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.4, 0.85);
            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene); composer.addPass(bloom);

            buildEnvironment();
            localPlayerMesh = createHuman(myId);
            scene.add(localPlayerMesh);

            setupJoystick();
            animate();
        }

        function buildEnvironment() {
            // Pavimento a specchio
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.1, metalness: 0.9 }));
            floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8, roughness: 0.5 });
            
            // Funzione muri con collisione
            const addWall = (w, h, d, x, z) => {
                const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat);
                m.position.set(x, h/2, z); scene.add(m);
                colliders.push(new THREE.Box3().setFromObject(m));
            };

            addWall(60, 20, 1, 0, -30); // Parete Nord
            addWall(1, 20, 60, -30, 0); // Ovest
            addWall(1, 20, 60, 30, 0);  // Est

            // TUBI LUNGO LE PARETI
            for(let i=0; i<3; i++) {
                const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 60, 16), new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 1 }));
                pipe.rotation.z = Math.PI/2; pipe.position.set(0, 1+i*5, -29.5);
                scene.add(pipe);
            }

            // MONITOR GIGANTI CON COORDINATE
            const createMonitor = (x, z, rot) => {
                const monitorGroup = new THREE.Group();
                const frame = new THREE.Mesh(new THREE.BoxGeometry(10, 6, 0.5), new THREE.MeshStandardMaterial({ color: 0x000000 }));
                monitorGroup.add(frame);

                const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                const texture = new THREE.CanvasTexture(canvas);
                
                setInterval(() => {
                    ctx.fillStyle = '#000810'; ctx.fillRect(0,0,512,256);
                    ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(0, 128); ctx.lineTo(512, 128); ctx.stroke();
                    ctx.fillStyle = '#00e5ff'; ctx.font = '24px monospace';
                    ctx.fillText(`STAR-ROUTE: ${Math.random().toFixed(4)}`, 20, 50);
                    ctx.fillText(`COORD-X: ${Math.random().toFixed(2)}`, 20, 80);
                    ctx.fillText("SYSTEM: CRIOPUNK ALPHA-9", 20, 220);
                    texture.needsUpdate = true;
                }, 100);

                const screen = new THREE.Mesh(new THREE.PlaneGeometry(9.5, 5.5), new THREE.MeshBasicMaterial({ map: texture }));
                screen.position.z = 0.3; monitorGroup.add(screen);
                monitorGroup.position.set(x, 5, z); monitorGroup.rotation.y = rot;
                scene.add(monitorGroup);
                colliders.push(new THREE.Box3().setFromObject(frame));
            };

            createMonitor(-12, -29.4, 0);
            createMonitor(12, -29.4, 0);

            // Luci d'atmosfera
            const blueL = new THREE.PointLight(0x00e5ff, 2, 40); blueL.position.set(-15, 10, -10); scene.add(blueL);
            const redL = new THREE.PointLight(0xff0033, 1, 40); redL.position.set(15, 10, 10); scene.add(redL);
            scene.add(new THREE.AmbientLight(0xffffff, 0.15));
        }

        function createHuman(id) {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xe0ac69 });

            // Gambe (Pantaloni)
            const pantsColor = (id === 'davide') ? 0x4b3621 : (id === 'ivan' ? 0x2d3a18 : 0x222222);
            const legs = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 0.4), new THREE.MeshStandardMaterial({ color: pantsColor }));
            legs.position.y = 0.5; group.add(legs);

            // Tronco
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 0.5), new THREE.MeshStandardMaterial({ color: 0x333333 }));
            torso.position.y = 1.6; group.add(torso);

            // Testa
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), skinMat);
            head.position.y = 2.5; group.add(head);

            // DETTAGLI SPECIFICI
            if (id === 'davide') {
                // Cappotto lungo grigio scuro
                const coat = new THREE.Mesh(new THREE.BoxGeometry(1, 1.8, 0.6), new THREE.MeshStandardMaterial({ color: 0x2d2d2d }));
                coat.position.y = 1.4; group.add(coat);
                const hair = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.3), new THREE.MeshStandardMaterial({ color: 0x000000 }));
                hair.position.y = 2.75; group.add(hair);
            } 
            else if (id === 'ivan') {
                // Muscoloso, canottiera bianca, fucile
                torso.material.color.set(0xffffff); torso.scale.set(1.2, 1, 1.2);
                const rifle = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 1.5), new THREE.MeshStandardMaterial({ color: 0x000000 }));
                rifle.position.set(0.6, 1.6, 0.5); group.add(rifle);
                const hair = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.3), new THREE.MeshStandardMaterial({ color: 0x4b3621 }));
                hair.position.set(0.1, 2.75, 0); group.add(hair);
            }
            else if (id === 'jonny') {
                // Felpa nera con cappuccio
                torso.material.color.set(0x000000); torso.scale.set(1.1, 1.1, 1.1);
                const hood = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({ color: 0x000000 }));
                hood.position.y = 2.4; group.add(hood);
                legs.material.color.set(0xd2b48c); // Beige
                legs.scale.x = 1.3;
            }

            return group;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (localPlayerMesh) {
                const prevPos = localPlayerMesh.position.clone();

                if (Math.abs(joystickVector.x) > 0.1 || Math.abs(joystickVector.y) > 0.1) {
                    const forward = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
                    forward.y = 0; forward.normalize();
                    const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), forward);

                    const move = new THREE.Vector3().addScaledVector(forward, -joystickVector.y).addScaledVector(right, -joystickVector.x);
                    localPlayerMesh.position.addScaledVector(move, 0.2);
                    localPlayerMesh.rotation.y = Math.atan2(move.x, move.z);

                    // FISICA: Controllo Collisioni
                    const pBox = new THREE.Box3().setFromObject(localPlayerMesh);
                    let hit = false;
                    for(let col of colliders) { if(pBox.intersectsBox(col)) hit = true; }
                    if(hit) localPlayerMesh.position.copy(prevPos);

                    myPlayerRef.update({ x: localPlayerMesh.position.x, z: localPlayerMesh.position.z, angle: localPlayerMesh.rotation.y });
                }
            }

            Object.values(remotePlayers).forEach(p => {
                p.mesh.position.lerp(p.target, 0.2);
                p.mesh.rotation.y = THREE.MathUtils.lerp(p.mesh.rotation.y, p.tAngle, 0.2);
            });

            composer.render();
        }

        function syncRemoteState(state) {
            Object.keys(state).forEach(s => {
                if (s !== mySlot && s.startsWith('p')) {
                    if (!remotePlayers[s]) {
                        const m = createHuman(state[s].charKey);
                        scene.add(m);
                        remotePlayers[s] = { mesh: m, target: new THREE.Vector3(), tAngle: 0 };
                    }
                    remotePlayers[s].target.set(state[s].x, 0, state[s].z);
                    remotePlayers[s].tAngle = state[s].angle;
                }
            });
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const handle = (e) => {
                const t = e.touches ? e.touches[0] : e;
                const r = zone.getBoundingClientRect();
                const dx = t.clientX - (r.left + 70);
                const dy = t.clientY - (r.top + 70);
                const d = Math.min(Math.hypot(dx,dy), 50);
                const a = Math.atan2(dy,dx);
                knob.style.transform = `translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px)`;
                joystickVector = { x: (Math.cos(a)*d)/50, y: (Math.sin(a)*d)/50 };
            };
            zone.addEventListener('touchstart', e => e.preventDefault());
            window.addEventListener('touchmove', handle);
            window.addEventListener('mousemove', e => { if(e.buttons) handle(e); });
            window.addEventListener('touchend', () => { joystickVector = {x:0, y:0}; knob.style.transform = ''; });
            window.addEventListener('mouseup', () => { joystickVector = {x:0, y:0}; knob.style.transform = ''; });
        }

        function loggar(m, id) {
            const l = document.getElementById('log');
            l.innerHTML = `<div><span style="color:cyan">[${TEAM[id].n}]:</span> ${m}</div>` + l.innerHTML;
        }

        function attacca() { loggar("Fuoco blaster autorizzato.", myId); }
        function fruga() { loggar("Accesso ai terminali stellari...", myId); }

        initApp();
    </script>
</body>
</html>
