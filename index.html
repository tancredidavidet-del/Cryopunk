<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DEATH STAR INTERIOR 3D MULTIPLAYER</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        :root {
            --primary: #00e5ff;
            --imperial-red: #ff0033;
            --bg-glass: rgba(8, 10, 16, 0.88);
            --border-glass: rgba(0, 229, 255, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Share Tech Mono', monospace;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020305;
            color: #e5e5e5;
        }

        #game-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
        }

        .ui-layer * {
            pointer-events: auto;
        }

        .cyber-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: 4px solid var(--imperial-red);
            border-radius: 0 18px 18px 0;
            border: 1px solid var(--border-glass);
            box-shadow: 0 10px 35px rgba(0,0,0,0.8);
        }

        .selection-screen {
            position: fixed;
            inset: 0;
            z-index: 500;
            background: #020305;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
        }

        .char-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(12, 16, 24, 0.7);
            cursor: pointer;
        }

        .char-card.occupied {
            opacity: 0.35;
            filter: grayscale(0.8);
            pointer-events: none;
            border-color: rgba(255, 0, 0, 0.2);
        }

        .char-card:not(.occupied):hover, .char-card:not(.occupied):active {
            border-color: var(--primary);
            background: rgba(0, 229, 255, 0.15);
            transform: translateY(-2px);
        }

        .btn-home {
            background: linear-gradient(135deg, #ff0033 0%, #b30024 100%);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            font-weight: 900;
            font-size: 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 51, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-home:active {
            transform: scale(0.95);
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: rgba(0, 229, 255, 0.2);
            border-color: var(--primary);
        }

        .controls-layer {
            position: relative;
            width: 100%;
            height: 180px;
            pointer-events: none;
        }

        #joystick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 229, 255, 0.4);
            border-radius: 50%;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--imperial-red), var(--primary));
            border-radius: 50%;
            box-shadow: 0 0 15px var(--imperial-red);
            transform: translate(0px, 0px);
            transition: transform 0.05s ease-out;
            pointer-events: none;
        }

        #status-overlay {
            position: fixed;
            inset: 0;
            z-index: 600;
            background: rgba(2, 3, 5, 0.95);
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="selection-screen" class="selection-screen">
        <h1 class="text-red-500 text-3xl font-black italic mb-1 tracking-wider">DEATH STAR SECTOR 01</h1>
        <p class="text-neutral-500 text-[10px] mb-6 uppercase tracking-[0.3em]">Seleziona il personaggio per accedere alla Stanza dell'Impero...</p>
        <div id="char-grid" class="grid grid-cols-1 gap-3 max-w-md w-full mx-auto"></div>
    </div>

    <div id="game-ui" class="ui-layer hidden">
        <header class="flex justify-between items-center bg-neutral-900/90 p-4 rounded-2xl border border-white/10 mb-2">
            <div class="flex items-center gap-3">
                <div id="slot-dot" class="w-3.5 h-3.5 rounded-full"></div>
                <div>
                    <div id="my-tag" class="text-xs font-black text-cyan-400 uppercase italic">---</div>
                    <div class="text-[8px] text-neutral-400 uppercase tracking-widest">Morte Nera (<span id="online-count">1</span>/4 ONLINE SIMULTANEI)</div>
                </div>
            </div>
            <button class="btn-home" onclick="leaveRoomAndGoHome()">Home</button>
        </header>

        <main class="flex-1 flex flex-col justify-end space-y-2">
            <section class="cyber-panel p-4">
                <h2 id="room-name" class="text-sm font-black text-white uppercase tracking-tighter mb-1">Stanza di Controllo Imperiale</h2>
                <p id="room-desc" class="text-[9px] text-neutral-400 italic mb-3">Settore Principale Morte Nera - Tutti i giocatori sono sincronizzati in tempo reale.</p>
                <div id="actions" class="grid grid-cols-2 gap-2">
                    <button onclick="fruga()" class="btn-action">🔍 Ispeziona Console</button>
                    <button onclick="attacca()" class="btn-action border-red-500 text-red-400 hover:bg-red-950/40">⚡ Attiva Laser</button>
                </div>
            </section>

            <div id="log" class="h-20 bg-black/80 rounded-xl p-3 overflow-y-auto text-[8px] font-mono border border-white/5 space-y-1"></div>

            <div class="controls-layer">
                <div id="joystick-zone">
                    <div id="joystick-knob"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="status-overlay" class="hidden">
        <div class="bg-neutral-900/90 border border-cyan-500/30 rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
            <div id="overlay-title" class="text-2xl font-black text-cyan-400 mb-2">---</div>
            <div id="overlay-desc" class="text-xs text-neutral-400 mb-6">---</div>
            <button id="overlay-btn" class="btn-home w-full py-3" onclick="leaveRoomAndGoHome()">Torna alla Home</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        let db = null;
        let isFirebaseAvailable = false;

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                isFirebaseAvailable = true;
            }
        } catch (e) {
            console.warn("Firebase offline. Modalità multiplayer locale simulata.", e);
        }

        const ROOM_PATH = "active_sessions/rooms/lobby_1";

        const TEAM_DATA = {
            ivan: { n: "IVAN-VOSTOK", role: "Comandante Tattico", color: "#ff0033", num: 0xff0033, slot: "player1" },
            dave: { n: "DAVE-RIG", role: "Ingegnere Imperiale", color: "#fbbf24", num: 0xfbbf24, slot: "player2" },
            jonny: { n: "JONNY DARK", role: "Hacker Cyber", color: "#bc6ff1", num: 0xbc6ff1, slot: "player3" },
            sara: { n: "SARA-MED", role: "Ufficiale Medico", color: "#00e5ff", num: 0x00e5ff, slot: "player4" }
        };

        const SLOT_TO_CHAR = {
            player1: "ivan",
            player2: "dave",
            player3: "jonny",
            player4: "sara"
        };

        let myId = null;
        let mySlot = null;
        let myPlayerRef = null;
        let myClientId = 'cli_' + Math.random().toString(36).substr(2, 9);
        let roomState = {};

        let scene, camera, renderer, controls;
        let localPlayerMesh = null;
        const remotePlayers = {};
        let lastSyncTime = 0;

        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickVector = { x: 0, y: 0 };
        let joystickActive = false;
        let touchId = null;

        function initApp() {
            updateCharacterSelectionScreen();

            if (isFirebaseAvailable && db) {
                const roomRef = db.ref(ROOM_PATH);
                roomRef.on('value', (snapshot) => {
                    roomState = snapshot.val() || {};
                    updateCharacterSelectionScreen();
                    syncRoomUI();
                });
            }
        }

        function updateCharacterSelectionScreen() {
            const grid = document.getElementById('char-grid');
            if (!grid) return;

            grid.innerHTML = Object.keys(TEAM_DATA).map(charKey => {
                const char = TEAM_DATA[charKey];
                const slotData = roomState[char.slot];
                const occupied = !!slotData;

                return `
                    <div class="char-card p-4 rounded-xl flex justify-between items-center ${occupied ? 'occupied' : ''}" onclick="selectCharacter('${charKey}')">
                        <div class="flex items-center gap-3">
                            <div class="w-3.5 h-3.5 rounded-full" style="background-color: ${char.color}; box-shadow: 0 0 10px ${char.color}"></div>
                            <div>
                                <div class="text-white font-bold text-sm tracking-wide">${char.n}</div>
                                <div class="text-[9px] text-neutral-400">${char.role}</div>
                            </div>
                        </div>
                        <div class="text-[9px] font-black ${occupied ? 'text-red-500' : 'text-cyan-400'}">
                            ${occupied ? 'IN USO' : 'SELEZIONA'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectCharacter(charKey) {
            const targetChar = TEAM_DATA[charKey];
            const targetSlot = targetChar.slot;

            if (isFirebaseAvailable && db) {
                const roomRef = db.ref(ROOM_PATH);
                roomRef.transaction((data) => {
                    if (data === null) data = {};
                    if (data[targetSlot]) return;

                    data[targetSlot] = {
                        token: myClientId,
                        charKey: charKey,
                        x: (Math.random() - 0.5) * 6,
                        z: (Math.random() - 0.5) * 6,
                        angle: 0,
                        updatedAt: firebase.database.ServerValue.TIMESTAMP
                    };
                    return data;
                }, (error, committed, snapshot) => {
                    if (error || !committed) {
                        showOverlayError("Slot Occupato", "Giocatore già presente nella stanza.");
                        return;
                    }
                    enterGame(charKey, targetSlot);
                });
            } else {
                enterGame(charKey, targetSlot);
            }
        }

        function enterGame(charKey, targetSlot) {
            myId = charKey;
            mySlot = targetSlot;

            if (isFirebaseAvailable && db) {
                myPlayerRef = db.ref(`${ROOM_PATH}/${mySlot}`);
                myPlayerRef.onDisconnect().remove();
            }

            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('my-tag').innerText = TEAM_DATA[charKey].n;
            document.getElementById('slot-dot').style.backgroundColor = TEAM_DATA[charKey].color;

            loggar(`Entrato nella Stanza di Controllo Morte Nera.`, charKey);
            init3D();
        }

        function init3D() {
            const canvas = document.getElementById('game-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020305);
            scene.fog = new THREE.FogExp2(0x020305, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 14);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            const ambient = new THREE.AmbientLight(0x1a2436, 0.9);
            scene.add(ambient);

            const redSpot = new THREE.SpotLight(0xff0033, 1.5);
            redSpot.position.set(-15, 20, -15);
            redSpot.angle = Math.PI / 3;
            redSpot.penumbra = 0.8;
            redSpot.castShadow = true;
            scene.add(redSpot);

            const cyanSpot = new THREE.SpotLight(0x00e5ff, 1.5);
            cyanSpot.position.set(15, 20, 15);
            cyanSpot.angle = Math.PI / 3;
            cyanSpot.penumbra = 0.8;
            cyanSpot.castShadow = true;
            scene.add(cyanSpot);

            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x05060a,
                roughness: 0.15,
                metalness: 0.95
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(50, 25, 0x00e5ff, 0x152030);
            grid.position.y = 0.01;
            scene.add(grid);

            buildDeathStarRoom();

            const initialPos = (roomState && roomState[mySlot]) ? roomState[mySlot] : { x: 0, z: 0 };
            localPlayerMesh = createHumanoidPlayerMesh(myId);
            localPlayerMesh.position.set(initialPos.x, 0, initialPos.z);
            scene.add(localPlayerMesh);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enablePan = false;
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;
            controls.minDistance = 5;
            controls.maxDistance = 22;
            controls.target.copy(localPlayerMesh.position);

            window.addEventListener('resize', onWindowResize);
            setupJoystick();
            requestAnimationFrame(animate);
        }

        function buildDeathStarRoom() {
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x0f141e, roughness: 0.3, metalness: 0.9 });
            const lightBarMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2.0 });
            const redLightMat = new THREE.MeshStandardMaterial({ color: 0xff0033, emissive: 0xff0033, emissiveIntensity: 2.0 });

            for (let i = -20; i <= 20; i += 8) {
                const wallSection = new THREE.Mesh(new THREE.BoxGeometry(6, 12, 1), wallMat);
                wallSection.position.set(i, 6, -25);
                scene.add(wallSection);

                const lightBar = new THREE.Mesh(new THREE.BoxGeometry(0.6, 9, 1.1), lightBarMat);
                lightBar.position.set(i, 6, -25);
                scene.add(lightBar);
            }

            for (let z = -20; z <= 20; z += 10) {
                const wallW = new THREE.Mesh(new THREE.BoxGeometry(1, 12, 8), wallMat);
                wallW.position.set(-25, 6, z);
                scene.add(wallW);

                const lightBarW = new THREE.Mesh(new THREE.BoxGeometry(1.1, 9, 0.6), lightBarMat);
                lightBarW.position.set(-25, 6, z);
                scene.add(lightBarW);

                const wallE = new THREE.Mesh(new THREE.BoxGeometry(1, 12, 8), wallMat);
                wallE.position.set(25, 6, z);
                scene.add(wallE);

                const lightBarE = new THREE.Mesh(new THREE.BoxGeometry(1.1, 9, 0.6), redLightMat);
                lightBarE.position.set(25, 6, z);
                scene.add(lightBarE);
            }

            const consoleMat = new THREE.MeshStandardMaterial({ color: 0x171d2a, roughness: 0.2, metalness: 0.8 });
            const screenMat = new THREE.MeshStandardMaterial({ color: 0x00e5ff, emissive: 0x00e5ff, emissiveIntensity: 0.8 });

            [[-10, -12], [10, -12], [-10, 12], [10, 12]].forEach(pos => {
                const desk = new THREE.Mesh(new THREE.BoxGeometry(4, 1.8, 1.5), consoleMat);
                desk.position.set(pos[0], 0.9, pos[1]);
                desk.rotation.y = (pos[0] > 0 ? -0.3 : 0.3);
                desk.castShadow = true;
                scene.add(desk);

                const scr = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.8, 0.1), screenMat);
                scr.position.set(pos[0], 1.6, pos[1] - 0.4);
                scr.rotation.x = -0.4;
                scene.add(scr);
            });
        }

        function createHumanoidPlayerMesh(charKey) {
            const group = new THREE.Group();
            const char = TEAM_DATA[charKey] || TEAM_DATA.ivan;

            const torsoGeo = new THREE.BoxGeometry(0.7, 1.0, 0.4);
            const torsoMat = new THREE.MeshStandardMaterial({ color: char.num, roughness: 0.3, metalness: 0.7 });
            const torso = new THREE.Mesh(torsoGeo, torsoMat);
            torso.position.y = 1.3;
            torso.castShadow = true;
            group.add(torso);

            const headGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.5 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.0;
            group.add(head);

            const visorGeo = new THREE.BoxGeometry(0.4, 0.15, 0.25);
            const visorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: char.num, emissiveIntensity: 0.9 });
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.position.set(0, 2.0, 0.2);
            group.add(visor);

            const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.8);
            const armMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });

            const leftArm = new THREE.Mesh(armGeo, armMat);
            leftArm.position.set(-0.5, 1.3, 0);
            group.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, armMat);
            rightArm.position.set(0.5, 1.3, 0);
            group.add(rightArm);

            const legGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.9);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x020617 });

            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-0.25, 0.45, 0);
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(0.25, 0.45, 0);
            group.add(rightLeg);

            return group;
        }

        function syncRoomUI() {
            const activeCount = Object.keys(roomState).length || 1;
            const onlineCountEl = document.getElementById('online-count');
            if (onlineCountEl) onlineCountEl.innerText = activeCount;

            if (mySlot && scene) {
                const slots = ["player1", "player2", "player3", "player4"];
                slots.forEach(s => {
                    if (s !== mySlot) {
                        if (roomState[s]) {
                            if (!remotePlayers[s]) {
                                addRemotePlayer(s, roomState[s]);
                            } else {
                                updateRemotePlayer(s, roomState[s]);
                            }
                        } else if (remotePlayers[s]) {
                            removeRemotePlayer(s);
                        }
                    }
                });
            }
        }

        function addRemotePlayer(slot, data) {
            const charKey = data.charKey || SLOT_TO_CHAR[slot];
            const mesh = createHumanoidPlayerMesh(charKey);
            mesh.position.set(data.x, 0, data.z);
            mesh.rotation.y = data.angle || 0;
            scene.add(mesh);

            remotePlayers[slot] = {
                mesh: mesh,
                targetPos: new THREE.Vector3(data.x, 0, data.z),
                targetAngle: data.angle || 0
            };
        }

        function updateRemotePlayer(slot, data) {
            const p = remotePlayers[slot];
            if (p) {
                p.targetPos.set(data.x, 0, data.z);
                p.targetAngle = data.angle || 0;
            }
        }

        function removeRemotePlayer(slot) {
            if (remotePlayers[slot]) {
                scene.remove(remotePlayers[slot].mesh);
                delete remotePlayers[slot];
            }
        }

        function setupJoystick() {
            const maxRadius = 45;

            function handleStart(e) {
                if (touchId !== null) return;
                const touch = e.changedTouches ? e.changedTouches[0] : e;
                touchId = touch.identifier !== undefined ? touch.identifier : 'mouse';
                joystickActive = true;
                handleMove(e);
            }

            function handleMove(e) {
                if (!joystickActive) return;
                let touch = null;
                if (e.changedTouches) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchId) {
                            touch = e.changedTouches[i];
                            break;
                        }
                    }
                } else if (touchId === 'mouse') {
                    touch = e;
                }
                if (!touch) return;

                const rect = joystickZone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                let dist = Math.hypot(dx, dy);

                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                // INVERSIONE DESTRA / SINISTRA (-dx)
                joystickVector.x = -dx / maxRadius;
                joystickVector.y = dy / maxRadius;
            }

            function handleEnd(e) {
                if (!joystickActive) return;
                if (e.changedTouches) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchId) {
                            resetJoystick();
                            break;
                        }
                    }
                } else if (touchId === 'mouse') {
                    resetJoystick();
                }
            }

            function resetJoystick() {
                joystickActive = false;
                touchId = null;
                joystickVector = { x: 0, y: 0 };
                joystickKnob.style.transform = `translate(0px, 0px)`;
            }

            joystickZone.addEventListener('touchstart', handleStart, { passive: false });
            window.addEventListener('touchmove', handleMove, { passive: false });
            window.addEventListener('touchend', handleEnd, { passive: false });
            window.addEventListener('touchcancel', handleEnd, { passive: false });

            joystickZone.addEventListener('mousedown', handleStart);
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (localPlayerMesh) {
                if (Math.abs(joystickVector.x) > 0.05 || Math.abs(joystickVector.y) > 0.05) {
                    const forward = new THREE.Vector3();
                    camera.getWorldDirection(forward);
                    forward.y = 0;
                    forward.normalize();

                    const right = new THREE.Vector3();
                    right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).negate();

                    const moveDir = new THREE.Vector3()
                        .addScaledVector(forward, -joystickVector.y)
                        .addScaledVector(right, joystickVector.x);

                    if (moveDir.lengthSq() > 0.01) {
                        moveDir.normalize();
                        const speed = 0.15;
                        localPlayerMesh.position.addScaledVector(moveDir, speed);

                        const targetAngle = Math.atan2(moveDir.x, moveDir.z);
                        localPlayerMesh.rotation.y = THREE.MathUtils.lerp(localPlayerMesh.rotation.y, targetAngle, 0.2);

                        syncLocalMovement();
                    }
                }

                const prevTarget = controls.target.clone();
                controls.target.copy(localPlayerMesh.position);
                camera.position.add(controls.target.clone().sub(prevTarget));
            }

            for (let slot in remotePlayers) {
                const p = remotePlayers[slot];
                p.mesh.position.lerp(p.targetPos, 0.2);
                p.mesh.rotation.y = THREE.MathUtils.lerp(p.mesh.rotation.y, p.targetAngle, 0.2);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function syncLocalMovement() {
            if (!isFirebaseAvailable || !myPlayerRef || !localPlayerMesh) return;
            const now = Date.now();
            if (now - lastSyncTime > 40) {
                lastSyncTime = now;
                myPlayerRef.update({
                    x: localPlayerMesh.position.x,
                    z: localPlayerMesh.position.z,
                    angle: localPlayerMesh.rotation.y,
                    updatedAt: firebase.database.ServerValue.TIMESTAMP
                });
            }
        }

        async function leaveRoomAndGoHome() {
            if (myPlayerRef) {
                await myPlayerRef.remove();
            }
            window.location.href = 'index_home.html';
        }

        function fruga() {
            loggar("Console imperiale ispezionata. Sistemi Morte Nera operativi.", myId);
        }

        function attacca() {
            loggar("Laser tattico attivato nel settore!", myId);
        }

        function loggar(m, speaker) {
            const b = document.getElementById('log');
            if (!b) return;
            const char = TEAM_DATA[speaker] || { n: "IMPERIAL SYSTEM", color: "#888" };
            b.innerHTML = `<div style="border-left:2px solid ${char.color}; padding-left:6px;"><span style="color:${char.color}">${char.n}:</span> "${m}"</div>` + b.innerHTML;
        }

        function showOverlayError(title, desc) {
            document.getElementById('overlay-title').innerText = title;
            document.getElementById('overlay-desc').innerText = desc;
            document.getElementById('status-overlay').classList.remove('hidden');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
