<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRYOPUNK: ULTRA-TACTICAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        body { font-family: 'Orbitron', sans-serif; background: #000; margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        canvas { display: block; }
        
        /* UI OVERLAY */
        .hud-overlay { position: fixed; inset: 0; z-index: 100; pointer-events: none; display: flex; flex-direction: column; padding: 20px; }
        .hud-overlay * { pointer-events: auto; }
        .panel { background: rgba(0,0,0,0.8); border: 1px solid #0f0; border-radius: 4px; padding: 10px; box-shadow: 0 0 20px rgba(0,255,0,0.2); }

        /* SELEZIONE */
        .selection-screen { position: fixed; inset: 0; z-index: 1000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 300px; padding: 20px; border: 1px solid #333; margin: 10px; cursor: pointer; transition: 0.2s; text-align: center; }
        .card:hover { border-color: #0f0; background: rgba(0,255,0,0.1); }
        .card.occupied { opacity: 0.3; pointer-events: none; border-color: #f00; }

        /* CONTROLLI FLUIDI */
        .controls { position: fixed; bottom: 30px; left: 30px; display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; }
        .btn-ctrl { width: 70px; height: 70px; background: rgba(255,255,255,0.1); border: 2px solid #fff; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; touch-action: none; }
        .btn-ctrl.active { background: #0f0; border-color: #0f0; color: #000; }

        .btn-action { position: fixed; bottom: 30px; right: 30px; width: 100px; height: 100px; background: #f00; border: 4px solid #000; border-radius: 50%; color: #fff; font-weight: 900; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
    </style>
</head>
<body>

    <div id="selection-screen" class="selection-screen">
        <h1 class="text-white text-4xl font-black mb-10 tracking-[0.5em] uppercase">Cryopunk: 60FPS</h1>
        <div id="char-grid"></div>
    </div>

    <div id="game-hud" class="hud-overlay hidden">
        <div class="flex justify-between">
            <div class="panel">
                <div id="p-name" class="text-emerald-400 font-bold text-xs">UNIT: ---</div>
                <div class="w-48 h-1.5 bg-neutral-900 mt-2"><div id="hp-bar" class="h-full bg-emerald-500 transition-all" style="width:100%"></div></div>
            </div>
            <div class="panel text-center">
                <div class="text-[8px] text-emerald-500 font-bold uppercase">FPS</div>
                <div id="fps-counter" class="text-xl font-black text-white">60</div>
            </div>
        </div>

        <!-- D-PAD FLUIDO -->
        <div class="controls">
            <div></div><button class="btn-ctrl" id="up">▲</button><div></div>
            <button class="btn-ctrl" id="left">◀</button>
            <button class="btn-ctrl" id="down">▼</button>
            <button class="btn-ctrl" id="right">▶</button>
        </div>

        <button class="btn-action" onclick="attacca()">FIRE</button>
    </div>

    <script>
        // CONFIGURAZIONE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDzCp1PWbf82SfvhpZyXViK0Klf8rgDOcc",
            databaseURL: "https://cryopunk-90f36-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "cryopunk-90f36",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const TEAM = {
            dave: { n: "DAVE-RIG", h: 4.2, w: 1.0, color: 0xcccccc, hair: 0x000000, desc: "Alto, Capelli Neri" },
            ivan: { n: "IVAN-VOSTOK", h: 3.6, w: 2.2, color: 0x444444, hair: 0x5d4037, desc: "Massiccio, Capelli Marroni" },
            jonny: { n: "JONNY DARK", h: 3.8, w: 1.1, color: 0x222222, hair: 0x000000, desc: "Hacker, Agile" }
        };

        let myId = null;
        let gameState = {};
        let scene, camera, renderer, charMeshes = {};
        let input = { up: false, down: false, left: false, right: false };
        let clock = new THREE.Clock();

        // --- 3D ENGINE HIGH-END ---
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020202);
            scene.fog = new THREE.Fog(0x020202, 10, 80);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.body.appendChild(renderer.domElement);

            // Luci Realistiche
            const ambient = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0x00ffaa, 1.5);
            sun.position.set(20, 50, 20);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            scene.add(sun);

            // Pavimento Realistico
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.2 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI/2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Creazione Personaggi Realistici
            Object.keys(TEAM).forEach(id => {
                const data = TEAM[id];
                const group = new THREE.Group();
                
                // Busto (Capsula)
                const torsoGeo = new THREE.CapsuleGeometry(data.w * 0.4, data.h * 0.5, 4, 8);
                const torsoMat = new THREE.MeshStandardMaterial({color: data.color, metalness: 0.7, roughness: 0.3});
                const torso = new THREE.Mesh(torsoGeo, torsoMat);
                torso.position.y = data.h * 0.6;
                torso.castShadow = true;
                group.add(torso);

                // Testa
                const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
                const head = new THREE.Mesh(headGeo, new THREE.MeshStandardMaterial({color: 0xffdbac}));
                head.position.y = data.h * 1.1;
                group.add(head);

                // Capelli
                const hairGeo = new THREE.BoxGeometry(0.5, 0.2, 0.5);
                const hair = new THREE.Mesh(hairGeo, new THREE.MeshBasicMaterial({color: data.hair}));
                hair.position.y = data.h * 1.25;
                if(id === 'ivan') hair.rotation.z = 0.5;
                group.add(hair);

                scene.add(group);
                charMeshes[id] = group;
                group.position.set(Math.random()*10, 0, Math.random()*10);
            });

            setupInputHandlers();
            loop();
        }

        function setupInputHandlers() {
            const bind = (id, key) => {
                const el = document.getElementById(id);
                const start = (e) => { e.preventDefault(); input[key] = true; el.classList.add('active'); };
                const stop = (e) => { e.preventDefault(); input[key] = false; el.classList.remove('active'); };
                el.addEventListener('mousedown', start); el.addEventListener('mouseup', stop);
                el.addEventListener('touchstart', start); el.addEventListener('touchend', stop);
            };
            bind('up', 'up'); bind('down', 'down'); bind('left', 'left'); bind('right', 'right');
        }

        function loop() {
            requestAnimationFrame(loop);
            const delta = clock.getDelta();

            if (myId && charMeshes[myId]) {
                const mesh = charMeshes[myId];
                const speed = 15 * delta;
                const rotSpeed = 3 * delta;

                if (input.up) mesh.translateZ(-speed);
                if (input.down) mesh.translateZ(speed);
                if (input.left) mesh.rotation.y += rotSpeed;
                if (input.right) mesh.rotation.y -= rotSpeed;

                // Sync continuo su Firebase (ogni frame è troppo, facciamo un campionamento)
                if (clock.elapsedTime % 0.05 < 0.02) {
                    updateDB();
                }

                // Camera Smooth
                const idealPos = new THREE.Vector3(0, 10, 15).applyQuaternion(mesh.quaternion).add(mesh.position);
                camera.position.lerp(idealPos, 0.1);
                camera.lookAt(mesh.position.x, 2, mesh.position.z);
            }

            // Interpolazione altri giocatori
            Object.keys(gameState.players || {}).forEach(id => {
                if(id !== myId && charMeshes[id]) {
                    const p = gameState.players[id];
                    charMeshes[id].position.lerp(new THREE.Vector3(p.x, 0, p.z), 0.1);
                    charMeshes[id].rotation.y = p.r;
                }
            });

            renderer.render(scene, camera);
        }

        // --- FIREBASE SYNC ---
        db.ref('game').on('value', (snap) => {
            gameState = snap.val();
            if (!gameState) initServer();
            else {
                if (!myId) updateSelectionUI();
            }
        });

        function initServer() {
            const players = {};
            Object.keys(TEAM).forEach(k => players[k] = {x:0, z:0, r:0, s:'LIBERO', h:100});
            db.ref('game').set({ players });
        }

        function updateSelectionUI() {
            const grid = document.getElementById('char-grid');
            grid.innerHTML = Object.keys(TEAM).map(key => {
                const occupied = gameState.players[key].s !== 'LIBERO';
                return `
                    <div class="card ${occupied ? 'occupied' : ''}" onclick="pick('${key}')">
                        <div class="text-white font-black text-xl">${TEAM[key].n}</div>
                        <div class="text-emerald-500 text-[10px] mt-1 uppercase">${TEAM[key].desc}</div>
                        <div class="text-[9px] mt-2 ${occupied ? 'text-red-500' : 'text-emerald-500'}">${occupied ? 'ONLINE' : 'SVEGLIA'}</div>
                    </div>
                `;
            }).join('');
        }

        function pick(id) {
            myId = id;
            const ref = db.ref(`game/players/${id}`);
            ref.update({ s: 'OCCUPATO' });
            ref.onDisconnect().update({ s: 'LIBERO' });

            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-hud').style.display = 'block';
            document.getElementById('p-name').innerText = "UNIT: " + TEAM[id].n;
            init3D();
        }

        function updateDB() {
            db.ref(`game/players/${myId}`).update({
                x: charMeshes[myId].position.x,
                z: charMeshes[myId].position.z,
                r: charMeshes[myId].rotation.y
            });
        }

        function attacca() {
            if(window.navigator.vibrate) window.navigator.vibrate(50);
            console.log("FIRE");
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
