<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Multiplayer Arena 4K</title>
    <style>
        :root {
            --primary: #00f2fe;
            --accent: #4facfe;
            --bg-glass: rgba(15, 23, 42, 0.75);
            --border-glass: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            color: #ffffff;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #hud-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 12px 18px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            pointer-events: auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .player-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .slot-indicator {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        .room-info {
            font-size: 0.85rem;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-home {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            transition: all 0.2s ease;
            pointer-events: auto;
        }

        .btn-home:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(255, 65, 108, 0.6);
        }

        .controls-layer {
            position: relative;
            width: 100%;
            height: 200px;
            pointer-events: none;
        }

        #joystick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary);
            transform: translate(0px, 0px);
            transition: transform 0.05s ease-out;
            pointer-events: none;
        }

        #status-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .overlay-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 36px 28px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .overlay-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .overlay-desc {
            font-size: 0.95rem;
            color: #a0aec0;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="hud-container">
        <div class="top-bar">
            <div class="player-badge">
                <div id="slot-dot" class="slot-indicator" style="background-color: #777;"></div>
                <span id="player-slot-name">Connessione...</span>
            </div>
            <div class="room-info">Lobby 1 (<span id="online-count">0</span>/4)</div>
            <button class="btn-home" onclick="leaveRoomAndGoHome()">Home</button>
        </div>

        <div class="controls-layer">
            <div id="joystick-zone">
                <div id="joystick-knob"></div>
            </div>
        </div>
    </div>

    <div id="status-overlay">
        <div class="overlay-card">
            <div id="overlay-spinner" class="spinner"></div>
            <div id="overlay-title" class="overlay-title">Accesso alla Stanza...</div>
            <div id="overlay-desc" class="overlay-desc">Assegnazione dello slot giocatore in corso.</div>
            <button id="overlay-btn" class="btn-home hidden" onclick="leaveRoomAndGoHome()">Torna alla Home</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const ROOM_PATH = "active_sessions/rooms/lobby_1";

        const SLOT_COLORS = {
            player1: { name: "Player 1", hex: "#ff3366", num: 0xff3366 },
            player2: { name: "Player 2", hex: "#3399ff", num: 0x3399ff },
            player3: { name: "Player 3", hex: "#00ffcc", num: 0x00ffcc },
            player4: { name: "Player 4", hex: "#ffcc00", num: 0xffcc00 }
        };

        let mySlot = null;
        let myPlayerRef = null;
        let myClientId = 'cli_' + Math.random().toString(36).substr(2, 9);
        let scene, camera, renderer, controls;
        let localPlayerMesh = null;
        const remotePlayers = {};
        let lastSyncTime = 0;

        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickVector = { x: 0, y: 0 };
        let joystickActive = false;
        let touchId = null;

        function initThreeJS() {
            const canvas = document.getElementById('game-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0c14);
            scene.fog = new THREE.FogExp2(0x0a0c14, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 14);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 100;
            const d = 25;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            const floorGeo = new THREE.PlaneGeometry(60, 60);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x121624, roughness: 0.4, metalness: 0.2 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(60, 30, 0x00f2fe, 0x1f293d);
            grid.position.y = 0.01;
            scene.add(grid);

            const boxGeo = new THREE.BoxGeometry(2, 4, 2);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 });
            const positions = [[-8, -8], [8, 8], [-8, 8], [8, -8]];
            positions.forEach(pos => {
                const obstacle = new THREE.Mesh(boxGeo, boxMat);
                obstacle.position.set(pos[0], 2, pos[1]);
                obstacle.castShadow = true;
                obstacle.receiveShadow = true;
                scene.add(obstacle);
            });

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enablePan = false;
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;
            controls.minDistance = 6;
            controls.maxDistance = 22;

            window.addEventListener('resize', onWindowResize);
            setupJoystick();
            requestAnimationFrame(animate);
        }

        function createPlayerMesh(colorHex) {
            const group = new THREE.Group();

            const bodyGeo = new THREE.CapsuleGeometry(0.5, 1.0, 8, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.5 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.0;
            body.castShadow = true;
            group.add(body);

            const visorGeo = new THREE.BoxGeometry(0.6, 0.25, 0.4);
            const visorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.9, emissive: 0x222222 });
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.position.set(0, 1.25, 0.35);
            group.add(visor);

            return group;
        }

        function setupJoystick() {
            const maxRadius = 45;

            function handleStart(e) {
                if (touchId !== null) return;
                const touch = e.changedTouches ? e.changedTouches[0] : e;
                touchId = touch.identifier !== undefined ? touch.identifier : 'mouse';
                joystickActive = true;
                handleMove(e);
            }

            function handleMove(e) {
                if (!joystickActive) return;
                let touch = null;
                if (e.changedTouches) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchId) {
                            touch = e.changedTouches[i];
                            break;
                        }
                    }
                } else if (touchId === 'mouse') {
                    touch = e;
                }
                if (!touch) return;

                const rect = joystickZone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                let dist = Math.hypot(dx, dy);

                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickVector.x = dx / maxRadius;
                joystickVector.y = dy / maxRadius;
            }

            function handleEnd(e) {
                if (!joystickActive) return;
                if (e.changedTouches) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchId) {
                            resetJoystick();
                            break;
                        }
                    }
                } else if (touchId === 'mouse') {
                    resetJoystick();
                }
            }

            function resetJoystick() {
                joystickActive = false;
                touchId = null;
                joystickVector = { x: 0, y: 0 };
                joystickKnob.style.transform = `translate(0px, 0px)`;
            }

            joystickZone.addEventListener('touchstart', handleStart, { passive: false });
            window.addEventListener('touchmove', handleMove, { passive: false });
            window.addEventListener('touchend', handleEnd, { passive: false });
            window.addEventListener('touchcancel', handleEnd, { passive: false });

            joystickZone.addEventListener('mousedown', handleStart);
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);
        }

        function joinMultiplayerRoom() {
            const roomRef = db.ref(ROOM_PATH);

            roomRef.transaction((roomData) => {
                if (roomData === null) roomData = {};
                const slots = ["player1", "player2", "player3", "player4"];
                let assigned = null;

                for (let s of slots) {
                    if (!roomData[s]) {
                        assigned = s;
                        break;
                    }
                }

                if (!assigned) return;

                roomData[assigned] = {
                    token: myClientId,
                    x: (Math.random() - 0.5) * 10,
                    z: (Math.random() - 0.5) * 10,
                    angle: 0,
                    updatedAt: firebase.database.ServerValue.TIMESTAMP
                };
                return roomData;
            }, (error, committed, snapshot) => {
                if (error) {
                    showOverlayError("Errore Connessione", "Impossibile connettersi al server.");
                    return;
                }
                if (!committed) {
                    showOverlayError("Stanza Piena (4/4)", "La stanza ha raggiunto il limite massimo di 4 giocatori.");
                    return;
                }

                const data = snapshot.val();
                const slots = ["player1", "player2", "player3", "player4"];
                for (let s of slots) {
                    if (data[s] && data[s].token === myClientId) {
                        mySlot = s;
                        break;
                    }
                }

                if (mySlot) {
                    setupLocalPlayer(data[mySlot]);
                }
            });
        }

        function setupLocalPlayer(initialData) {
            myPlayerRef = db.ref(`${ROOM_PATH}/${mySlot}`);
            myPlayerRef.onDisconnect().remove();

            document.getElementById('slot-dot').style.backgroundColor = SLOT_COLORS[mySlot].hex;
            document.getElementById('slot-dot').style.boxShadow = `0 0 10px ${SLOT_COLORS[mySlot].hex}`;
            document.getElementById('player-slot-name').innerText = `${SLOT_COLORS[mySlot].name}`;
            document.getElementById('status-overlay').classList.add('hidden');

            localPlayerMesh = createPlayerMesh(SLOT_COLORS[mySlot].num);
            localPlayerMesh.position.set(initialData.x, 0, initialData.z);
            scene.add(localPlayerMesh);

            controls.target.copy(localPlayerMesh.position);

            listenRoomEvents();
        }

        function listenRoomEvents() {
            const roomRef = db.ref(ROOM_PATH);

            roomRef.on('value', (snapshot) => {
                const roomData = snapshot.val() || {};
                const activeCount = Object.keys(roomData).length;
                document.getElementById('online-count').innerText = activeCount;

                const slots = ["player1", "player2", "player3", "player4"];
                slots.forEach(slot => {
                    if (slot !== mySlot) {
                        if (roomData[slot]) {
                            if (!remotePlayers[slot]) {
                                addRemotePlayer(slot, roomData[slot]);
                            } else {
                                updateRemotePlayer(slot, roomData[slot]);
                            }
                        } else if (remotePlayers[slot]) {
                            removeRemotePlayer(slot);
                        }
                    }
                });
            });
        }

        function addRemotePlayer(slot, data) {
            const mesh = createPlayerMesh(SLOT_COLORS[slot].num);
            mesh.position.set(data.x, 0, data.z);
            mesh.rotation.y = data.angle || 0;
            scene.add(mesh);

            remotePlayers[slot] = {
                mesh: mesh,
                targetPos: new THREE.Vector3(data.x, 0, data.z),
                targetAngle: data.angle || 0
            };
        }

        function updateRemotePlayer(slot, data) {
            const p = remotePlayers[slot];
            if (p) {
                p.targetPos.set(data.x, 0, data.z);
                p.targetAngle = data.angle || 0;
            }
        }

        function removeRemotePlayer(slot) {
            if (remotePlayers[slot]) {
                scene.remove(remotePlayers[slot].mesh);
                delete remotePlayers[slot];
            }
        }

        function syncLocalMovement() {
            if (!myPlayerRef || !localPlayerMesh) return;
            const now = Date.now();
            if (now - lastSyncTime > 40) {
                lastSyncTime = now;
                myPlayerRef.update({
                    x: localPlayerMesh.position.x,
                    z: localPlayerMesh.position.z,
                    angle: localPlayerMesh.rotation.y,
                    updatedAt: firebase.database.ServerValue.TIMESTAMP
                });
            }
        }

        async function leaveRoomAndGoHome() {
            if (myPlayerRef) {
                await myPlayerRef.remove();
            }
            window.location.href = 'index_home.html';
        }

        window.addEventListener('beforeunload', () => {
            if (myPlayerRef) {
                myPlayerRef.remove();
            }
        });

        function animate() {
            requestAnimationFrame(animate);

            if (localPlayerMesh) {
                if (Math.abs(joystickVector.x) > 0.05 || Math.abs(joystickVector.y) > 0.05) {
                    const forward = new THREE.Vector3();
                    camera.getWorldDirection(forward);
                    forward.y = 0;
                    forward.normalize();

                    const right = new THREE.Vector3();
                    right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).negate();

                    const moveDir = new THREE.Vector3()
                        .addScaledVector(forward, -joystickVector.y)
                        .addScaledVector(right, joystickVector.x);

                    if (moveDir.lengthSq() > 0.01) {
                        moveDir.normalize();
                        const speed = 0.12;
                        localPlayerMesh.position.addScaledVector(moveDir, speed);

                        const targetAngle = Math.atan2(moveDir.x, moveDir.z);
                        localPlayerMesh.rotation.y = THREE.MathUtils.lerp(localPlayerMesh.rotation.y, targetAngle, 0.2);

                        syncLocalMovement();
                    }
                }

                const prevTarget = controls.target.clone();
                controls.target.copy(localPlayerMesh.position);
                camera.position.add(controls.target.clone().sub(prevTarget));
            }

            for (let slot in remotePlayers) {
                const p = remotePlayers[slot];
                p.mesh.position.lerp(p.targetPos, 0.2);
                p.mesh.rotation.y = THREE.MathUtils.lerp(p.mesh.rotation.y, p.targetAngle, 0.2);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function showOverlayError(title, desc) {
            document.getElementById('overlay-spinner').classList.add('hidden');
            document.getElementById('overlay-title').innerText = title;
            document.getElementById('overlay-desc').innerText = desc;
            document.getElementById('overlay-btn').classList.remove('hidden');
        }

        window.addEventListener('DOMContentLoaded', () => {
            initThreeJS();
            joinMultiplayerRoom();
        });
    </script>
</body>
</html>
