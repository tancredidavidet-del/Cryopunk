<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRYOPUNK: ULTRA REALISM 60FPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Share+Tech+Mono&display=swap');
        body { font-family: 'Share Tech Mono', monospace; background: #000; margin: 0; overflow: hidden; }
        canvas { display: block; filter: contrast(1.1) brightness(1.1); }
        .hud { position: fixed; inset: 0; z-index: 100; pointer-events: none; display: flex; flex-direction: column; padding: 20px; }
        .hud * { pointer-events: auto; }
        
        /* SELEZIONE REALISTICA */
        .selection-overlay { position: fixed; inset: 0; z-index: 1000; background: radial-gradient(circle at center, #111, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .milit-card { width: 100%; max-width: 400px; padding: 25px; border: 2px solid #333; margin-bottom: 12px; cursor: pointer; transition: 0.2s; position: relative; background: rgba(255,255,255,0.02); }
        .milit-card:hover { border-color: #0f0; box-shadow: 0 0 20px rgba(0,255,0,0.2); }
        .milit-card.occupied { opacity: 0.4; filter: grayscale(1); pointer-events: none; border-color: #f00; }
        
        /* CONTROLLI PROFESSIONALI */
        .d-pad { position: fixed; bottom: 40px; left: 40px; display: grid; grid-template-columns: repeat(3, 75px); gap: 12px; }
        .btn-c { width: 75px; height: 75px; background: rgba(0,0,0,0.6); border: 2px solid #fff; border-radius: 12px; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; touch-action: none; transition: 0.1s; }
        .btn-c.active { background: #0f0; color: #000; border-color: #0f0; transform: scale(0.9); }
        
        .status-panel { background: rgba(0,0,0,0.85); border-left: 5px solid #0f0; padding: 15px; border-radius: 0 10px 10px 0; }
        .btn-fire { position: fixed; bottom: 40px; right: 40px; width: 110px; height: 110px; background: radial-gradient(#f00, #900); border: 4px solid #fff; border-radius: 50%; color: #fff; font-family: 'Big Shoulders Display'; font-size: 24px; font-weight: 900; box-shadow: 0 10px 30px rgba(255,0,0,0.4); }
    </style>
</head>
<body>

    <!-- SELEZIONE EROE -->
    <div id="selection-screen" class="selection-overlay">
        <h1 class="text-white text-4xl font-black mb-10 tracking-[0.4em] uppercase italic">GOLGOTHA-IV // OPERATIVES</h1>
        <div id="char-grid" class="w-full flex flex-col items-center"></div>
        <p class="text-[9px] text-neutral-600 mt-10 uppercase tracking-widest">Sincronizzazione Heartbeat Attiva</p>
    </div>

    <!-- HUD DI GIOCO -->
    <div id="game-hud" class="hud hidden">
        <div class="flex justify-between">
            <div class="status-panel w-64">
                <div id="p-name" class="text-white font-black text-sm italic tracking-widest">UNIT: ---</div>
                <div class="w-full h-1.5 bg-neutral-900 mt-2"><div id="hp-bar" class="h-full bg-emerald-500" style="width:100%"></div></div>
                <div class="flex justify-between mt-2 text-[8px] font-bold text-emerald-400"><span>RES: 3840x2160</span><span id="fps-txt">60 FPS</span></div>
            </div>
        </div>

        <div class="d-pad">
            <div></div><button class="btn-c" id="up">▲</button><div></div>
            <button class="btn-c" id="left">◀</button>
            <button class="btn-c" id="down">▼</button>
            <button class="btn-c" id="right">▶</button>
        </div>

        <button class="btn-fire" onclick="vittoria()">ESCIE</button>
    </div>

    <script>
        // CONFIGURAZIONE FIREBASE (Usa la tua chiave qui)
        const firebaseConfig = {
            apiKey: "AIzaSyDzCp1PWbf82SfvhpZyXViK0Klf8rgDOcc",
            databaseURL: "https://cryopunk-90f36-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "cryopunk-90f36",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const TEAM = {
            dave: { n: "DAVE-RIG", h: 4.5, w: 0.9, color: 0x999999, hair: 0x000000, role: "Ingegnere" },
            ivan: { n: "IVAN-VOSTOK", h: 3.8, w: 2.2, color: 0x444444, hair: 0x5d4037, role: "Assalto" },
            jonny: { n: "JONNY DARK", h: 4.0, w: 1.0, color: 0x111111, hair: 0x000000, role: "Hacker" }
        };

        let myId = null;
        let gameState = {};
        let scene, camera, renderer, charMeshes = {};
        let input = { up: false, down: false, left: false, right: false };
        let clock = new THREE.Clock();

        // --- ENGINE 3D HIGH RESOLUTION ---
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.Fog(0x050505, 20, 100);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 2000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio > 1 ? 2 : 1); // Alta risoluzione Retina
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // Luci Realistiche
            scene.add(new THREE.AmbientLight(0xffffff, 0.2));
            const mainLight = new THREE.DirectionalLight(0x00ffaa, 1.8);
            mainLight.position.set(30, 60, 30);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.set(2048, 2048);
            scene.add(mainLight);

            // Terreno Riflettente
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(1000, 1000),
                new THREE.MeshStandardMaterial({ color: 0x080808, metalness: 0.8, roughness: 0.1 })
            );
            ground.rotation.x = -Math.PI/2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Creazione Operativi
            Object.keys(TEAM).forEach(id => {
                const d = TEAM[id];
                const group = new THREE.Group();
                
                // Corpo PBR
                const body = new THREE.Mesh(
                    new THREE.CapsuleGeometry(d.w * 0.4, d.h * 0.6, 10, 20),
                    new THREE.MeshStandardMaterial({color: d.color, metalness: 0.9, roughness: 0.4})
                );
                body.position.y = d.h * 0.7;
                body.castShadow = true;
                group.add(body);

                // Testa
                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(0.45, 20, 20),
                    new THREE.MeshStandardMaterial({color: 0xffdbac, roughness: 0.8})
                );
                head.position.y = d.h * 1.3;
                group.add(head);

                // Capelli (Dettaglio Dave/Ivan)
                const hair = new THREE.Mesh(
                    new THREE.BoxGeometry(0.6, 0.2, 0.6),
                    new THREE.MeshBasicMaterial({color: d.hair})
                );
                hair.position.y = d.h * 1.45;
                if(id==='ivan') hair.rotation.z = 0.5;
                group.add(hair);

                scene.add(group);
                charMeshes[id] = group;
            });

            bindInputs();
            gameLoop();
        }

        function bindInputs() {
            const keys = ['up', 'down', 'left', 'right'];
            keys.forEach(k => {
                const el = document.getElementById(k);
                const start = (e) => { e.preventDefault(); input[k] = true; el.classList.add('active'); };
                const stop = (e) => { e.preventDefault(); input[k] = false; el.classList.remove('active'); };
                el.addEventListener('mousedown', start); el.addEventListener('mouseup', stop);
                el.addEventListener('touchstart', start); el.addEventListener('touchend', stop);
            });
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            const delta = clock.getDelta();

            if (myId && charMeshes[myId]) {
                const m = charMeshes[myId];
                const speed = 18 * delta; // Velocità calibrata 60fps
                const rSpeed = 3.5 * delta;

                if (input.up) m.translateZ(-speed);
                if (input.down) m.translateZ(speed);
                if (input.left) m.rotation.y += rSpeed;
                if (input.right) m.rotation.y -= rSpeed;

                // Sync Database ogni 3 frame per non intasare
                if (clock.elapsedTime % 0.05 < 0.02) syncToFirebase();

                // Camera Smooth Realistica
                const offset = new THREE.Vector3(0, 12, 18).applyQuaternion(m.quaternion).add(m.position);
                camera.position.lerp(offset, 0.1);
                camera.lookAt(m.position.x, 3, m.position.z);
            }

            // Interpolazione fluida amici
            Object.keys(gameState.players || {}).forEach(id => {
                if(id !== myId && charMeshes[id]) {
                    const p = gameState.players[id];
                    // Se il giocatore è offline (heartbeat fallito), nascondi mesh
                    const isOnline = (Date.now() - p.lastSeen < 6000);
                    charMeshes[id].visible = isOnline;
                    if(isOnline) {
                        charMeshes[id].position.lerp(new THREE.Vector3(p.x, 0, p.z), 0.1);
                        charMeshes[id].rotation.y = p.r;
                    }
                }
            });

            renderer.render(scene, camera);
        }

        // --- FIREBASE HEARTBEAT & SYNC ---
        db.ref('game').on('value', (snap) => {
            gameState = snap.val();
            if(!gameState) initServer();
            else if(!myId) updateSelectionUI();
        });

        function initServer() {
            const ps = {};
            Object.keys(TEAM).forEach(k => ps[k] = {x:0, z:0, r:0, s:'LIBERO', lastSeen: 0});
            db.ref('game').set({ players: ps });
        }

        function updateSelectionUI() {
            const grid = document.getElementById('char-grid');
            grid.innerHTML = Object.keys(TEAM).map(k => {
                const p = gameState.players[k];
                // Heartbeat check: se non scrive da 6 secondi, è libero
                const isOccupied = (p.s === 'OCCUPATO' && (Date.now() - p.lastSeen < 6000));
                return `
                    <div class="milit-card ${isOccupied ? 'occupied' : ''}" onclick="pick('${k}')">
                        <div class="text-white font-black text-xl italic uppercase">${TEAM[k].n}</div>
                        <div class="text-emerald-500 text-[10px] font-bold uppercase tracking-widest">${TEAM[k].role}</div>
                        <div class="absolute right-6 top-1/2 -translate-y-1/2 text-[10px] font-black ${isOccupied ? 'text-red-500' : 'text-emerald-500'}">
                            ${isOccupied ? '[ ONLINE ]' : '[ STANDBY ]'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function pick(id) {
            myId = id;
            db.ref(`game/players/${id}`).update({ s: 'OCCUPATO', lastSeen: Date.now() });
            
            // Inizia Heartbeat: Scrive ogni 2 secondi che sei ancora qui
            setInterval(() => {
                db.ref(`game/players/${myId}/lastSeen`).set(Date.now());
            }, 2000);

            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-hud').style.display = 'block';
            document.getElementById('p-name').innerText = "OPERATIVO: " + TEAM[id].n;
            init3D();
        }

        function syncToFirebase() {
            db.ref(`game/players/${myId}`).update({
                x: charMeshes[myId].position.x,
                z: charMeshes[myId].position.z,
                r: charMeshes[myId].rotation.y
            });
        }

        function vittoria() { location.reload(); }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
