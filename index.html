<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CRIOPUNK - OFFICIAL SECTOR</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Post-Processing per bagliore e realismo -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap');
        
        :root { --primary: #00e5ff; --accent: #ff0033; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Share Tech Mono', monospace; color: white; }
        #game-canvas { position: fixed; inset: 0; z-index: 1; }

        .selection-screen {
            position: fixed; inset: 0; z-index: 100; 
            background: radial-gradient(circle at center, #0a1120 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .title-glow {
            font-family: 'Orbitron', sans-serif; font-size: clamp(3rem, 10vw, 6rem); font-weight: 900; 
            text-shadow: 0 0 30px var(--primary); font-style: italic; letter-spacing: 15px; color: #fff;
        }

        .char-grid { display: grid; grid-template-cols: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 90%; max-width: 1100px; margin-top: 40px; }
        .char-card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1);
            padding: 30px; border-radius: 24px; cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .char-card:hover { border-color: var(--primary); background: rgba(0, 229, 255, 0.08); transform: translateY(-10px); }
        .char-card.occupied { opacity: 0.3; filter: grayscale(1); pointer-events: none; }

        .ui-layer { position: relative; z-index: 10; pointer-events: none; height: 100vh; display: flex; flex-direction: column; padding: 25px; }
        .ui-layer * { pointer-events: auto; }
        
        .hud-bar { width: 220px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        #hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--accent), var(--primary)); transition: 0.6s ease; }

        #joystick-zone { width: 130px; height: 130px; border: 2px solid rgba(0, 229, 255, 0.4); border-radius: 50%; position: absolute; bottom: 40px; left: 40px; background: rgba(0,229,255,0.03); backdrop-filter: blur(10px); }
        #joystick-knob { width: 50px; height: 50px; background: var(--primary); border-radius: 50%; position: absolute; top: 40px; left: 40px; box-shadow: 0 0 20px var(--primary); }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <!-- SCHERMATA START -->
    <div id="selection-screen" class="selection-screen">
        <div class="title-glow">CRIOPUNK</div>
        <div class="text-cyan-400 tracking-[0.8em] text-[10px] uppercase mt-2">Database Europe-West1 Active</div>
        <div id="char-grid" class="char-grid"></div>
    </div>

    <!-- HUD GIOCO -->
    <div id="game-ui" class="ui-layer hidden">
        <div class="flex justify-between items-start">
            <div class="bg-black/40 p-4 rounded-2xl border border-white/5 backdrop-blur-md">
                <div class="text-[9px] text-cyan-400 font-black mb-2 tracking-[0.2em] uppercase">Status Integrità Armatura</div>
                <div class="hud-bar"><div id="hp-fill"></div></div>
            </div>
            <div class="text-[9px] text-right text-white/40 uppercase leading-relaxed">
                Settore: Cryo-90F36<br>Server: Europe-West<br>Coordinate: Sincronizzate
            </div>
        </div>

        <div class="mt-auto flex flex-col gap-4">
            <div id="log" class="h-24 overflow-y-auto bg-black/60 p-4 rounded-xl border border-white/5 text-[10px] text-cyan-200/60 font-mono"></div>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="fruga()" class="bg-white/5 border border-white/10 p-4 rounded-xl font-bold text-[10px] tracking-widest hover:bg-white/10 active:scale-95 transition-all">TERMINALE / AZIONE</button>
                <button onclick="attacca()" class="bg-red-500/10 border border-red-500/30 p-4 rounded-xl font-bold text-[10px] tracking-widest text-red-400 hover:bg-red-500/20 active:scale-95 transition-all">FUOCO BLASTER</button>
            </div>
            <div style="height: 160px;"></div>
        </div>
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
    </div>

    <script>
        // CONFIGURAZIONE DEFINITIVA FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDzCp1PWbf82SfvhpZyXViK0Klf8rgDOcc",
            authDomain: "cryopunk-90f36.firebaseapp.com",
            databaseURL: "https://cryopunk-90f36-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "cryopunk-90f36",
            storageBucket: "cryopunk-90f36.appspot.com",
            messagingSenderId: "593721385474",
            appId: "1:593721385474:web:193026f8d09ca086431940" 
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const ROOM_PATH = "criopunk_realistic_sector_final";

        const TEAM = {
            davide: { n: "DAVIDE", desc: "Slanciato, cappotto grigio lungo, capelli neri corti.", slot: "p1" },
            ivan: { n: "IVAN", desc: "Muscoloso, canottiera bianca, mimetico, fucile.", slot: "p2" },
            jonny: { n: "JONNY", desc: "Hoodie nero, cappuccio, pantaloni beige larghi.", slot: "p3" }
        };

        let scene, camera, renderer, composer, localPlayerMesh, doorMesh;
        let myId, mySlot, myPlayerRef;
        let remotePlayers = {};
        let joystickVector = { x: 0, y: 0 };
        const obstacles = [];

        function initApp() {
            const grid = document.getElementById('char-grid');
            
            // Visualizza subito i personaggi (fallback)
            const render = (state) => {
                grid.innerHTML = Object.keys(TEAM).map(k => {
                    const char = TEAM[k];
                    const occ = state && state[char.slot];
                    return `
                        <div class="char-card ${occ ? 'occupied' : ''}" onclick="selectChar('${k}')">
                            <div class="text-2xl font-black text-white tracking-tighter mb-1">${char.n}</div>
                            <div class="text-[10px] text-cyan-400 uppercase leading-relaxed mb-6 opacity-70">${char.desc}</div>
                            <div class="text-[9px] ${occ ? 'text-red-500' : 'text-green-400'} font-black tracking-[0.2em]">
                                ${occ ? 'UNITÀ ATTIVA' : 'SISTEMA PRONTO'}
                            </div>
                        </div>
                    `;
                }).join('');
            };

            render({}); // Stato iniziale vuoto

            db.ref(ROOM_PATH).on('value', snap => {
                const state = snap.val() || {};
                render(state);
                syncRemote(state);
            }, err => console.error("Firebase Error:", err));
        }

        function selectChar(key) {
            const slot = TEAM[key].slot;
            db.ref(`${ROOM_PATH}/${slot}`).transaction(curr => {
                if (curr) return;
                return { charKey: key, x: Math.random()*5-2.5, z: Math.random()*5-2.5, angle: 0, hp: 100 };
            }, (err, ok) => { if (ok) start(key, slot); });
        }

        function start(key, slot) {
            myId = key; mySlot = slot;
            myPlayerRef = db.ref(`${ROOM_PATH}/${mySlot}`);
            myPlayerRef.onDisconnect().remove();
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-ui').classList.remove('hidden');
            init3D();
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010205, 0.04);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 12, 18);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.shadowMap.enabled = true;

            const renderPass = new THREE.RenderPass(scene, camera);
            const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.85);
            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderPass); composer.addPass(bloom);

            buildMap();
            localPlayerMesh = createHuman(myId);
            scene.add(localPlayerMesh);

            setupJoystick();
            animate();
        }

        function buildMap() {
            // Pavimento Lucido Riflettente
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.05, metalness: 0.95 }));
            floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.4 });
            const addObj = (w, h, d, x, z) => {
                const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat);
                m.position.set(x, h/2, z); scene.add(m);
                obstacles.push(new THREE.Box3().setFromObject(m));
            };

            // Pareti con collisioni
            addObj(60, 18, 1, 0, -30); // Nord
            addObj(1, 18, 60, -30, 0); // Ovest
            addObj(1, 18, 60, 30, 0);  // Est

            // TUBI LUNGO LE PARETI
            for(let i=0; i<4; i++) {
                const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 60, 12), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 1 }));
                pipe.rotation.z = Math.PI/2; pipe.position.set(0, 2+i*4, -29.4);
                scene.add(pipe);
            }

            // MONITOR GIGANTI CON ROTTE STELLARI
            const createMonitor = (x, z, rot) => {
                const group = new THREE.Group();
                const frame = new THREE.Mesh(new THREE.BoxGeometry(10, 6, 0.6), new THREE.MeshStandardMaterial({ color: 0x000000 }));
                group.add(frame);

                const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                const texture = new THREE.CanvasTexture(canvas);
                
                setInterval(() => {
                    ctx.fillStyle = '#000a12'; ctx.fillRect(0,0,512,256);
                    ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 1;
                    // Disegna rotte stellari casuali
                    for(let i=0; i<3; i++) {
                        ctx.beginPath(); ctx.moveTo(Math.random()*512, Math.random()*256);
                        ctx.lineTo(Math.random()*512, Math.random()*256); ctx.stroke();
                    }
                    ctx.fillStyle = '#00e5ff'; ctx.font = '22px monospace';
                    ctx.fillText(`SECTOR_ALPHA: ${Math.random().toFixed(4)}`, 20, 40);
                    ctx.fillText(`COORDINATES: ${Math.random().toFixed(2)} / ${Math.random().toFixed(2)}`, 20, 70);
                    ctx.fillText("STATUS: SCANNING...", 20, 230);
                    texture.needsUpdate = true;
                }, 120);

                const screen = new THREE.Mesh(new THREE.PlaneGeometry(9.6, 5.6), new THREE.MeshBasicMaterial({ map: texture }));
                screen.position.z = 0.35; group.add(screen);
                group.position.set(x, 5, z); group.rotation.y = rot;
                scene.add(group);
                obstacles.push(new THREE.Box3().setFromObject(frame));
            };

            createMonitor(-12, -29.4, 0);
            createMonitor(12, -29.4, 0);

            // Luci d'ambiente realistiche
            const l1 = new THREE.PointLight(0x00e5ff, 2.5, 40); l1.position.set(-15, 10, -15); scene.add(l1);
            const l2 = new THREE.PointLight(0xff0033, 1.2, 40); l2.position.set(15, 10, 15); scene.add(l2);
            scene.add(new THREE.AmbientLight(0xffffff, 0.1));
        }

        function createHuman(id) {
            const g = new THREE.Group();
            const skin = new THREE.MeshStandardMaterial({ color: 0xdbac98 });

            // Gambe e Piedi
            const legsGeo = new THREE.BoxGeometry(0.7, 1.1, 0.4);
            const legsMat = new THREE.MeshStandardMaterial();
            const legs = new THREE.Mesh(legsGeo, legsMat);
            legs.position.y = 0.55; g.add(legs);

            // Tronco
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.3, 0.5), new THREE.MeshStandardMaterial());
            torso.position.y = 1.7; g.add(torso);

            // Testa
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), skin);
            head.position.y = 2.6; g.add(head);

            if (id === 'davide') {
                // Davide: Cappotto grigio scuro, capelli neri corti, slanciato, pantaloni marroni
                legsMat.color.set(0x4b3621);
                torso.material.color.set(0x2d2d2d); // Cappotto
                torso.scale.set(1.1, 1.4, 1.2); 
                const hair = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.15, 0.35), new THREE.MeshStandardMaterial({ color: 0x000000 }));
                hair.position.y = 2.85; g.add(hair);
            } 
            else if (id === 'ivan') {
                // Ivan: Muscoloso, canottiera bianca, pantaloni mimetici, capelli rasati sui lati, fucile
                legsMat.color.set(0x1e3932); // Mimetico scuro
                torso.material.color.set(0xffffff); // Canottiera
                torso.scale.set(1.4, 1.1, 1.4); // Molto muscoloso
                const hair = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.3), new THREE.MeshStandardMaterial({ color: 0x4b3621 }));
                hair.position.set(0.1, 2.85, 0); g.add(hair); // Rasati lati
                const gun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 1.6), new THREE.MeshStandardMaterial({ color: 0x111111 }));
                gun.position.set(0.7, 1.8, 0.4); g.add(gun);
            }
            else if (id === 'jonny') {
                // Jonny: Felpa nera con cappuccio, pantaloni beige molto larghi
                legsMat.color.set(0xd2b48c); // Beige
                legs.scale.x = 1.5; // Pantaloni larghi
                torso.material.color.set(0x000000); // Felpa
                const hood = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12, 0, Math.PI*2, 0, Math.PI/1.5), new THREE.MeshStandardMaterial({ color: 0x000000 }));
                hood.position.y = 2.45; g.add(hood); // Cappuccio in testa
            }

            g.castShadow = true;
            return g;
        }

        function animate() {
            requestAnimationFrame(animate);
            if (localPlayerMesh) {
                const prevPos = localPlayerMesh.position.clone();
                if (Math.abs(joystickVector.x) > 0.1 || Math.abs(joystickVector.y) > 0.1) {
                    const forward = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
                    forward.y = 0; forward.normalize();
                    const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), forward);
                    const move = new THREE.Vector3().addScaledVector(forward, -joystickVector.y).addScaledVector(right, -joystickVector.x);
                    
                    localPlayerMesh.position.addScaledVector(move, 0.22);
                    localPlayerMesh.rotation.y = Math.atan2(move.x, move.z);

                    // FISICA COLLISIONI
                    const pBox = new THREE.Box3().setFromObject(localPlayerMesh);
                    let hit = false;
                    for(let col of obstacles) { if(pBox.intersectsBox(col)) hit = true; }
                    if(hit) localPlayerMesh.position.copy(prevPos);

                    myPlayerRef.update({ x: localPlayerMesh.position.x, z: localPlayerMesh.position.z, angle: localPlayerMesh.rotation.y });
                }
            }
            Object.values(remotePlayers).forEach(p => {
                p.mesh.position.lerp(p.target, 0.2);
                p.mesh.rotation.y = THREE.MathUtils.lerp(p.mesh.rotation.y, p.tAngle, 0.2);
            });
            composer.render();
        }

        function syncRemote(state) {
            Object.keys(state).forEach(s => {
                if(s !== mySlot && s.startsWith('p')) {
                    if(!remotePlayers[s]) {
                        remotePlayers[s] = { mesh: createHuman(state[s].charKey), target: new THREE.Vector3(), tAngle: 0 };
                        scene.add(remotePlayers[s].mesh);
                    }
                    remotePlayers[s].target.set(state[s].x, 0, state[s].z);
                    remotePlayers[s].tAngle = state[s].angle;
                }
            });
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const handle = (e) => {
                const t = e.touches ? e.touches[0] : e;
                const r = zone.getBoundingClientRect();
                const dx = t.clientX - (r.left + 65);
                const dy = t.clientY - (r.top + 65);
                const d = Math.min(Math.hypot(dx,dy), 50);
                const a = Math.atan2(dy,dx);
                knob.style.transform = `translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px)`;
                joystickVector = { x: (Math.cos(a)*d)/50, y: (Math.sin(a)*d)/50 };
            };
            zone.addEventListener('touchstart', e => e.preventDefault());
            window.addEventListener('touchmove', handle);
            window.addEventListener('mousemove', e => { if(e.buttons) handle(e); });
            window.addEventListener('touchend', () => { joystickVector = {x:0, y:0}; knob.style.transform = ''; });
            window.addEventListener('mouseup', () => { joystickVector = {x:0, y:0}; knob.style.transform = ''; });
        }

        function attacca() { loggar("Scarica blaster rilevata nel settore.", myId); }
        function fruga() { loggar("Tentativo di accesso ai dati stellari...", myId); }
        function loggar(m, id) {
            const l = document.getElementById('log');
            l.innerHTML = `<div><span style="color:cyan">[${TEAM[id].n}]:</span> ${m}</div>` + l.innerHTML;
        }

        initApp();
    </script>
</body>
</html>
