<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRYOPUNK: ELITE TACTICAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Firebase Legacy SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Orbitron', sans-serif; }
        #c3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* UI Overlay */
        .hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; padding: 20px; }
        .hud * { pointer-events: auto; }
        
        .selection-screen { 
            position: fixed; inset: 0; z-index: 100; background: #000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 10px solid #111;
        }

        .btn-char { 
            width: 320px; padding: 25px; margin: 10px; background: #050505; 
            border-left: 5px solid #333; color: white; cursor: pointer; 
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        .btn-char:hover { border-left-color: #0f0; background: #0a0a0a; padding-left: 35px; }
        .btn-char::after { content: 'READY?'; position: absolute; right: -50px; opacity: 0; transition: 0.3s; color: #0f0; font-size: 10px; }
        .btn-char:hover::after { right: 20px; opacity: 1; }

        .d-pad { position: fixed; bottom: 40px; left: 40px; display: grid; grid-template-columns: repeat(3, 65px); gap: 10px; }
        .btn-ctrl { 
            width: 65px; height: 65px; background: rgba(0,255,0,0.05); border: 1px solid rgba(0,255,0,0.3); 
            color: #0f0; display: flex; align-items: center; justify-content: center; font-size: 20px; clip-path: polygon(15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%, 0 15%);
        }
        .btn-ctrl.active { background: #0f0; color: #000; box-shadow: 0 0 20px #0f0; }
        
        .nametag { position: absolute; color: white; background: rgba(0,0,0,0.7); padding: 2px 8px; border: 1px solid #0f0; font-size: 10px; pointer-events: none; transform: translate(-50%, -50%); white-space: nowrap; }

        /* Effetto Scanline */
        body::before {
            content: " "; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 20; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="c3d"></div>
    <div id="tags-container" style="position: absolute; inset: 0; z-index: 5; pointer-events: none;"></div>

    <div id="selection-screen" class="selection-screen">
        <div style="text-align: center; margin-bottom: 50px;">
            <h1 style="font-size: 4rem; font-weight: 900; color: #fff; letter-spacing: -2px;">CRYO<span style="color: #0f0;">PUNK</span></h1>
            <p style="color: #444; font-size: 12px; letter-spacing: 5px;">TACTICAL ONLINE PREVIEW</p>
        </div>
        <div class="btn-char" onclick="pick('dave')">DAVE.RIG <span style="display:block; font-size:9px; color:#666;">SYS_ENGINEER</span></div>
        <div class="btn-char" onclick="pick('ivan')">IVAN.VST <span style="display:block; font-size:9px; color:#666;">HEAVY_ASSAULT</span></div>
        <div class="btn-char" onclick="pick('jonny')">JONNY.DRK <span style="display:block; font-size:9px; color:#666;">INFILTRATOR</span></div>
    </div>

    <div id="game-ui" class="hud" style="display: none;">
        <div style="background: rgba(0,0,0,0.8); border-left: 4px solid #0f0; padding: 10px; width: 220px;">
            <div id="p-name" style="font-size: 12px; color: #fff;">UNIT: ---</div>
            <div id="p-coords" style="font-size: 9px; color: #0f0; font-family: monospace;">LOC: 0.0, 0.0</div>
        </div>

        <div class="d-pad">
            <div></div><button class="btn-ctrl" id="up">W</button><div></div>
            <button class="btn-ctrl" id="left">A</button>
            <button class="btn-ctrl" id="down">S</button>
            <button class="btn-ctrl" id="right">D</button>
        </div>
        
        <button onclick="location.reload()" style="position:fixed; top:20px; right:20px; color:#555; font-size:10px;">[ TERMINATE_SESSION ]</button>
    </div>

    <script>
        // CONFIGURAZIONE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDzCp1PWbf82SfvhpZyXViK0Klf8rgDOcc",
            databaseURL: "https://cryopunk-90f36-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "cryopunk-90f36",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myId = null, scene, camera, renderer, clock = new THREE.Clock();
        let myMesh = null, otherPlayers = {}, input = { up: false, down: false, left: false, right: false };
        let lastNetUpdate = 0;

        const teamData = {
            dave: { color: 0x00ffff, h: 1.6, w: 0.4 },
            ivan: { color: 0xff0055, h: 1.9, w: 0.7 },
            jonny: { color: 0xcc00ff, h: 1.7, w: 0.35 }
        };

        function createPlayerMesh(type, name) {
            const data = teamData[type] || teamData.dave;
            const group = new THREE.Group();
            
            // Corpo con materiale "Neon"
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(data.w * 2, data.h, data.w),
                new THREE.MeshStandardMaterial({ 
                    color: data.color, 
                    emissive: data.color, 
                    emissiveIntensity: 2 
                })
            );
            body.position.y = data.h / 2;
            group.add(body);

            // Visore (per capire la direzione)
            const visor = new THREE.Mesh(
                new THREE.BoxGeometry(data.w * 1.5, 0.2, 0.2),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            visor.position.set(0, data.h - 0.3, -data.w/2);
            group.add(visor);

            // Etichetta Nome (HTML)
            const label = document.createElement('div');
            label.className = 'nametag';
            label.innerText = name.split('_')[0].toUpperCase();
            document.getElementById('tags-container').appendChild(label);
            group.userData.label = label;

            return group;
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.getElementById('c3d').appendChild(renderer.domElement);

            // Illuminazione
            scene.add(new THREE.AmbientLight(0x222222));
            const pLight = new THREE.PointLight(0x0f0, 1.5, 50);
            pLight.position.set(0, 10, 0);
            scene.add(pLight);

            // Griglia Pavimento Avanzata
            const grid = new THREE.GridHelper(200, 40, 0x00ff00, 0x111111);
            scene.add(grid);

            setupInput();
            listenToPlayers();
            loop();
        }

        function setupInput() {
            const handleKey = (e, val) => {
                const k = e.key.toLowerCase();
                if(k === 'w' || k === 'arrowup') input.up = val;
                if(k === 's' || k === 'arrowdown') input.down = val;
                if(k === 'a' || k === 'arrowleft') input.left = val;
                if(k === 'd' || k === 'arrowright') input.right = val;
            };
            window.onkeydown = (e) => handleKey(e, true);
            window.onkeyup = (e) => handleKey(e, false);

            const bind = (id, key) => {
                const el = document.getElementById(id);
                el.onpointerdown = () => { input[key] = true; el.classList.add('active'); };
                el.onpointerup = () => { input[key] = false; el.classList.remove('active'); };
            };
            bind('up', 'up'); bind('down', 'down'); bind('left', 'left'); bind('right', 'right');
        }

        function listenToPlayers() {
            db.ref('game/players').on('value', (snap) => {
                const players = snap.val() || {};
                Object.keys(players).forEach(id => {
                    if (id === myId) return;
                    if (!otherPlayers[id]) {
                        otherPlayers[id] = createPlayerMesh(players[id].type, id);
                        scene.add(otherPlayers[id]);
                    }
                    otherPlayers[id].targetPos = { x: players[id].x, z: players[id].z, r: players[id].r };
                });
                // Rimuovi disconnessi
                Object.keys(otherPlayers).forEach(id => {
                    if (!players[id]) {
                        if(otherPlayers[id].userData.label) otherPlayers[id].userData.label.remove();
                        scene.remove(otherPlayers[id]);
                        delete otherPlayers[id];
                    }
                });
            });
        }

        function loop() {
            requestAnimationFrame(loop);
            const dt = clock.getDelta();
            const now = Date.now();

            if (myMesh) {
                // Movimento Locale
                const speed = 12 * dt;
                const rotSpeed = 3 * dt;
                if (input.up) myMesh.translateZ(-speed);
                if (input.down) myMesh.translateZ(speed);
                if (input.left) myMesh.rotation.y += rotSpeed;
                if (input.right) myMesh.rotation.y -= rotSpeed;

                // Limiti mappa (Collisione semplice)
                myMesh.position.x = THREE.MathUtils.clamp(myMesh.position.x, -95, 95);
                myMesh.position.z = THREE.MathUtils.clamp(myMesh.position.z, -95, 95);

                // Throttling Network (Ogni 50ms)
                if (now - lastNetUpdate > 50) {
                    db.ref(`game/players/${myId}`).update({
                        x: myMesh.position.x, z: myMesh.position.z, r: myMesh.rotation.y,
                        last: now
                    });
                    lastNetUpdate = now;
                    document.getElementById('p-coords').innerText = `LOC: ${myMesh.position.x.toFixed(1)}, ${myMesh.position.z.toFixed(1)}`;
                }

                // Camera Smooth Follow
                const camOffset = new THREE.Vector3(0, 12, 18).applyMatrix4(myMesh.matrixWorld);
                camera.position.lerp(camOffset, 0.1);
                camera.lookAt(myMesh.position.x, 1, myMesh.position.z);
                updateTag(myMesh, "TU");
            }

            // Interpolazione altri giocatori e update tags
            Object.keys(otherPlayers).forEach(id => {
                const p = otherPlayers[id];
                if (p.targetPos) {
                    p.position.x = THREE.MathUtils.lerp(p.position.x, p.targetPos.x, 0.15);
                    p.position.z = THREE.MathUtils.lerp(p.position.z, p.targetPos.z, 0.15);
                    p.rotation.y = THREE.MathUtils.lerp(p.rotation.y, p.targetPos.r, 0.15);
                }
                updateTag(p, id.split('_')[0]);
            });

            renderer.render(scene, camera);
        }

        function updateTag(mesh, text) {
            if (!mesh.userData.label) return;
            const vector = mesh.position.clone().add(new THREE.Vector3(0, 2.5, 0));
            vector.project(camera);
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (vector.y * -0.5 + 0.5) * window.innerHeight;
            mesh.userData.label.style.left = `${x}px`;
            mesh.userData.label.style.top = `${y}px`;
            mesh.userData.label.style.display = vector.z < 1 ? 'block' : 'none';
        }

        function pick(type) {
            myId = type + "_" + Math.floor(Math.random() * 999);
            document.getElementById('selection-screen').style.opacity = 0;
            setTimeout(() => document.getElementById('selection-screen').style.display = 'none', 300);
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('p-name').innerText = "UNIT: " + myId.toUpperCase();
            
            myMesh = createPlayerMesh(type, myId);
            scene.add(myMesh);

            const userRef = db.ref(`game/players/${myId}`);
            userRef.set({ type: type, x: 0, z: 0, r: 0 });
            userRef.onDisconnect().remove();

            init3D();
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
