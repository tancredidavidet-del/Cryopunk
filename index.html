<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRYOPUNK: TACTICAL RECON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');
        body { font-family: 'Share Tech Mono', monospace; background: #000; margin: 0; overflow: hidden; touch-action: none; -webkit-user-select: none; }
        canvas { display: block; position: absolute; inset: 0; z-index: 1; }
        
        /* UI OVERLAY */
        .hud { position: fixed; inset: 0; z-index: 100; pointer-events: none; display: flex; flex-direction: column; padding: 15px; }
        .hud * { pointer-events: auto; }
        
        /* SELEZIONE */
        .selection-overlay { position: fixed; inset: 0; z-index: 1000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .milit-card { width: 100%; max-width: 380px; padding: 20px; border: 1px solid #333; margin-bottom: 8px; cursor: pointer; background: #0a0a0a; transition: 0.2s; }
        .milit-card:hover { border-color: #0f0; }
        .milit-card.occupied { opacity: 0.2; pointer-events: none; filter: grayscale(1); }

        /* CONTROLLI TOUCH */
        .d-pad { position: fixed; bottom: 30px; left: 30px; display: grid; grid-template-columns: repeat(3, 75px); gap: 10px; }
        .btn-c { width: 75px; height: 75px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); border-radius: 15px; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; touch-action: none; }
        .btn-c.active { background: #0f0; border-color: #fff; color: #000; box-shadow: 0 0 20px #0f0; }
        
        .status-box { background: rgba(0,0,0,0.8); border-left: 4px solid #0f0; padding: 12px; }
        .btn-exit { position: fixed; bottom: 30px; right: 30px; width: 90px; height: 90px; background: #f00; border: 3px solid #fff; border-radius: 50%; color: #fff; font-family: 'Orbitron'; font-size: 14px; font-weight: 900; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
    </style>
</head>
<body>

    <!-- SELEZIONE -->
    <div id="selection-screen" class="selection-overlay">
        <h1 class="text-white text-3xl font-black mb-1 uppercase italic tracking-tighter" style="font-family: 'Orbitron';">CRYOPUNK</h1>
        <p class="text-emerald-500 text-[9px] mb-8 tracking-[0.4em] uppercase">Golgotha-IV // Tactical Sync</p>
        <div id="char-grid" class="w-full flex flex-col items-center"></div>
    </div>

    <!-- HUD -->
    <div id="game-hud" class="hud hidden">
        <div class="status-box w-56">
            <div id="p-name" class="text-white font-black text-[11px] tracking-widest uppercase">---</div>
            <div class="w-full h-1 bg-neutral-900 mt-2"><div id="hp-bar" class="h-full bg-emerald-500" style="width:100%"></div></div>
            <div class="text-[7px] text-emerald-500 font-bold mt-1 uppercase">Stato: Operativo // 60FPS</div>
        </div>

        <!-- D-PAD OTTIMIZZATO PER TOUCH -->
        <div class="d-pad">
            <div></div><button class="btn-c" id="up">▲</button><div></div>
            <button class="btn-c" id="left">◀</button>
            <button class="btn-c" id="down">▼</button>
            <button class="btn-c" id="right">▶</button>
        </div>

        <button class="btn-exit" onclick="location.reload()">LOGOUT</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDzCp1PWbf82SfvhpZyXViK0Klf8rgDOcc",
            databaseURL: "https://cryopunk-90f36-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "cryopunk-90f36",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const TEAM = {
            dave: { n: "DAVE-RIG", h: 4.8, w: 0.9, color: 0xcccccc, hair: 0x000000 },
            ivan: { n: "IVAN-VOSTOK", h: 4.0, w: 2.2, color: 0x444444, hair: 0x5d4037 },
            jonny: { n: "JONNY DARK", h: 4.2, w: 1.0, color: 0x111111, hair: 0x000000 }
        };

        let myId = null;
        let gameState = {};
        let scene, camera, renderer, charMeshes = {};
        let input = { up: false, down: false, left: false, right: false };
        let clock = new THREE.Clock();

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const sun = new THREE.DirectionalLight(0x00ffaa, 1.2);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            sun.shadow.mapSize.set(2048, 2048);
            scene.add(sun);

            // AMBIENTE REALE
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(2000, 2000),
                new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 })
            );
            floor.rotation.x = -Math.PI/2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Griglia Pavimento per orientamento
            const grid = new THREE.GridHelper(1000, 100, 0x00ff00, 0x222222);
            grid.position.y = 0.05;
            scene.add(grid);

            // OSTACOLI AMBIENTALI
            for(let i=0; i<40; i++) {
                const box = new THREE.Mesh(
                    new THREE.BoxGeometry(8, 8, 8),
                    new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 1, roughness: 0.2 })
                );
                box.position.set(Math.random()*400-200, 4, Math.random()*400-200);
                box.castShadow = true;
                scene.add(box);
            }

            // CREAZIONE MODELLI
            Object.keys(TEAM).forEach(id => {
                const d = TEAM[id];
                const group = new THREE.Group();
                const body = new THREE.Mesh(
                    new THREE.CapsuleGeometry(d.w * 0.45, d.h * 0.65, 8, 16),
                    new THREE.MeshStandardMaterial({color: d.color, metalness: 0.8, roughness: 0.3})
                );
                body.position.y = d.h * 0.75;
                body.castShadow = true;
                group.add(body);

                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(0.5, 16, 16),
                    new THREE.MeshStandardMaterial({color: 0xffdbac})
                );
                head.position.y = d.h * 1.4;
                group.add(head);

                const hair = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.25, 0.65), new THREE.MeshBasicMaterial({color: d.hair}));
                hair.position.y = d.h * 1.55;
                if(id==='ivan') hair.rotation.z = 0.5;
                group.add(hair);

                scene.add(group);
                charMeshes[id] = group;
            });

            bindControls();
            loop();
        }

        function bindControls() {
            const keys = ['up', 'down', 'left', 'right'];
            keys.forEach(k => {
                const el = document.getElementById(k);
                const start = (e) => { e.preventDefault(); input[k] = true; el.classList.add('active'); };
                const stop = (e) => { e.preventDefault(); input[k] = false; el.classList.remove('active'); };
                
                el.addEventListener('touchstart', start, {passive: false});
                el.addEventListener('touchend', stop, {passive: false});
                el.addEventListener('mousedown', start);
                el.addEventListener('mouseup', stop);
            });
        }

        function loop() {
            requestAnimationFrame(loop);
            const delta = clock.getDelta();

            if (myId && charMeshes[myId]) {
                const m = charMeshes[myId];
                const speed = 25 * delta; // 60fps Motion
                const rSpeed = 4 * delta;

                if (input.up) m.translateZ(-speed);
                if (input.down) m.translateZ(speed);
                if (input.left) m.rotation.y += rSpeed;
                if (input.right) m.rotation.y -= rSpeed;

                if (clock.elapsedTime % 0.05 < 0.02) {
                    db.ref(`game/players/${myId}`).update({
                        x: m.position.x, z: m.position.z, r: m.rotation.y, lastSeen: Date.now()
                    });
                }

                // CAMERA REAR-HIGH (Inclinata Alto Posteriore)
                const relativeCameraOffset = new THREE.Vector3(0, 18, 28);
                const cameraOffset = relativeCameraOffset.applyMatrix4(m.matrixWorld);
                camera.position.lerp(cameraOffset, 0.1);
                // Guarda un punto davanti al personaggio per vedere l'ambiente
                const lookAtPos = m.position.clone();
                lookAtPos.y = 4;
                camera.lookAt(lookAtPos);
            }

            // Sync altri giocatori
            Object.keys(gameState.players || {}).forEach(id => {
                if(id !== myId && charMeshes[id]) {
                    const p = gameState.players[id];
                    const isOnline = (Date.now() - p.lastSeen < 6000);
                    charMeshes[id].visible = isOnline;
                    if(isOnline) {
                        charMeshes[id].position.lerp(new THREE.Vector3(p.x, 0, p.z), 0.1);
                        charMeshes[id].rotation.y = p.r;
                    }
                }
            });

            renderer.render(scene, camera);
        }

        db.ref('game').on('value', (snap) => {
            gameState = snap.val();
            if(!gameState) {
                const ps = {};
                Object.keys(TEAM).forEach(k => ps[k] = {x:0, z:0, r:0, s:'LIBERO', lastSeen:0});
                db.ref('game').set({ players: ps });
            } else if(!myId) updateSelection();
        });

        function updateSelection() {
            const grid = document.getElementById('char-grid');
            grid.innerHTML = Object.keys(TEAM).map(k => {
                const p = gameState.players[k];
                const isOccupied = (p.s === 'OCCUPATO' && (Date.now() - p.lastSeen < 6000));
                return `
                    <div class="milit-card ${isOccupied ? 'occupied' : ''}" onclick="pick('${k}')">
                        <div class="flex justify-between items-center">
                            <span class="text-white font-black uppercase text-lg">${TEAM[k].n}</span>
                            <span class="text-[9px] font-bold ${isOccupied ? 'text-red-500' : 'text-emerald-500'}">
                                ${isOccupied ? '[ ONLINE ]' : '[ STANDBY ]'}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function pick(id) {
            myId = id;
            db.ref(`game/players/${id}`).update({ s: 'OCCUPATO', lastSeen: Date.now() });
            setInterval(() => db.ref(`game/players/${myId}/lastSeen`).set(Date.now()), 2000);
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-hud').style.display = 'block';
            document.getElementById('p-name').innerText = "UNIT: " + TEAM[id].n;
            init3D();
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
