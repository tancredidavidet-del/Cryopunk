<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRYOPUNK: FIXED EDITION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Orbitron', sans-serif; }
        #c3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
        .hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; padding: 20px; color: white; }
        .hud * { pointer-events: auto; }
        .selection-screen { position: fixed; inset: 0; z-index: 100; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-char { width: 280px; padding: 20px; margin: 10px; background: #1a1a1a; border: 2px solid #333; color: white; border-radius: 8px; cursor: pointer; text-align: center; }
        .btn-char:hover { border-color: #0f0; background: #222; }
        .d-pad { position: fixed; bottom: 30px; left: 30px; display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; }
        .btn-ctrl { width: 70px; height: 70px; background: rgba(0,0,0,0.8); border: 1px solid #0f0; color: #0f0; display: flex; align-items: center; justify-content: center; font-size: 24px; border-radius: 10px; }
        .btn-ctrl.active { background: #0f0; color: #000; }
        #tags-container { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
        .nametag { position: absolute; color: #0f0; font-size: 10px; background: rgba(0,0,0,0.5); padding: 2px 5px; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

    <div id="c3d"></div>
    <div id="tags-container"></div>

    <div id="selection-screen" class="selection-screen">
        <h1 style="font-size: 2.5rem; margin-bottom: 20px;">CRYOPUNK</h1>
        <div class="btn-char" onclick="pick('dave')">DAVE-RIG (CYAN)</div>
        <div class="btn-char" onclick="pick('ivan')">IVAN-VST (RED)</div>
        <div class="btn-char" onclick="pick('jonny')">JONNY-DRK (PURPLE)</div>
    </div>

    <div id="game-ui" class="hud" style="display: none;">
        <div style="background: rgba(0,0,0,0.7); padding: 10px; border-left: 4px solid #0f0; width: fit-content;">
            <div id="p-name">UNIT: ---</div>
            <div style="font-size: 10px; color: #0f0;">SISTEMA ONLINE</div>
        </div>
        <div class="d-pad">
            <div></div><button class="btn-ctrl" id="up">W</button><div></div>
            <button class="btn-ctrl" id="left">A</button>
            <button class="btn-ctrl" id="down">S</button>
            <button class="btn-ctrl" id="right">D</button>
        </div>
        <button onclick="location.reload()" style="position:fixed; bottom:20px; right:20px; background:red; color:white; border:none; padding:10px; font-size:10px;">LOGOUT</button>
    </div>

    <script>
        // CONFIGURAZIONE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDzCp1PWbf82SfvhpZyXViK0Klf8rgDOcc",
            databaseURL: "https://cryopunk-90f36-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "cryopunk-90f36",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myId = null, scene, camera, renderer, clock = new THREE.Clock();
        let myMesh = null, otherPlayers = {}, input = {up: false, down: false, left: false, right: false};

        const teamData = {
            dave: { color: 0x00ffff, h: 2 },
            ivan: { color: 0xff0044, h: 2 },
            jonny: { color: 0xaa00ff, h: 2 }
        };

        function initEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.Fog(0x050505, 10, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            // Posizione di sicurezza iniziale per non vedere nero
            camera.position.set(0, 20, 30); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('c3d').appendChild(renderer.domElement);

            // Luci massicce per evitare il nero
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // Pavimento
            const grid = new THREE.GridHelper(200, 50, 0x00ff00, 0x222222);
            scene.add(grid);

            window.addEventListener('resize', onWindowResize);
            setupInput();
            loop();
        }

        function createPlayer(type, name, isLocal) {
            const data = teamData[type] || teamData.dave;
            const group = new THREE.Group();
            
            // Corpo principale (Box visibile)
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, data.h, 1.5),
                new THREE.MeshStandardMaterial({ color: data.color, emissive: data.color, emissiveIntensity: 0.5 })
            );
            body.position.y = data.h / 2;
            group.add(body);

            // "Occhi" per capire la direzione
            const eyes = new THREE.Mesh(
                new THREE.BoxGeometry(1.6, 0.4, 0.5),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            eyes.position.set(0, data.h - 0.5, -0.6);
            group.add(eyes);

            // Etichetta Nome
            const label = document.createElement('div');
            label.className = 'nametag';
            label.innerText = isLocal ? "TU" : name.split('_')[0].toUpperCase();
            document.getElementById('tags-container').appendChild(label);
            group.userData.label = label;

            scene.add(group);
            return group;
        }

        function setupInput() {
            // Tastiera
            window.onkeydown = (e) => {
                const k = e.key.toLowerCase();
                if(k==='w') input.up = true; if(k==='s') input.down = true;
                if(k==='a') input.left = true; if(k==='d') input.right = true;
            };
            window.onkeyup = (e) => {
                const k = e.key.toLowerCase();
                if(k==='w') input.up = false; if(k==='s') input.down = false;
                if(k==='a') input.left = false; if(k==='d') input.right = false;
            };
            // D-Pad
            const bind = (id, key) => {
                const el = document.getElementById(id);
                el.onpointerdown = () => { input[key] = true; el.classList.add('active'); };
                el.onpointerup = () => { input[key] = false; el.classList.remove('active'); };
            };
            bind('up', 'up'); bind('down', 'down'); bind('left', 'left'); bind('right', 'right');
        }

        function loop() {
            requestAnimationFrame(loop);
            const delta = clock.getDelta();

            if (myMesh) {
                const speed = 15 * delta;
                const rSpeed = 3 * delta;

                if (input.up) myMesh.translateZ(-speed);
                if (input.down) myMesh.translateZ(speed);
                if (input.left) myMesh.rotation.y += rSpeed;
                if (input.right) myMesh.rotation.y -= rSpeed;

                // Sync Database (Ogni 5 frame circa per non saturare)
                if (Math.random() > 0.8) {
                    db.ref(`game/players/${myId}`).update({
                        x: myMesh.position.x, z: myMesh.position.z, r: myMesh.rotation.y
                    });
                }

                // Camera follow
                const camPos = new THREE.Vector3(0, 15, 20).applyMatrix4(myMesh.matrixWorld);
                camera.position.lerp(camPos, 0.1);
                camera.lookAt(myMesh.position.x, 2, myMesh.position.z);
                
                updateTag(myMesh);
            }

            // Altri giocatori
            Object.keys(otherPlayers).forEach(id => {
                const p = otherPlayers[id];
                if (p.target) {
                    p.position.x = THREE.MathUtils.lerp(p.position.x, p.target.x, 0.2);
                    p.position.z = THREE.MathUtils.lerp(p.position.z, p.target.z, 0.2);
                    p.rotation.y = THREE.MathUtils.lerp(p.rotation.y, p.target.r, 0.2);
                }
                updateTag(p);
            });

            renderer.render(scene, camera);
        }

        function updateTag(mesh) {
            if (!mesh.userData.label) return;
            const vec = mesh.position.clone().add(new THREE.Vector3(0, 3, 0));
            vec.project(camera);
            const x = (vec.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-vec.y * 0.5 + 0.5) * window.innerHeight;
            mesh.userData.label.style.left = `${x}px`;
            mesh.userData.label.style.top = `${y}px`;
            mesh.userData.label.style.display = vec.z < 1 ? 'block' : 'none';
        }

        function pick(type) {
            myId = type + "_" + Math.floor(Math.random()*999);
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('p-name').innerText = "UNIT: " + myId;

            initEngine();
            myMesh = createPlayer(type, myId, true);

            // Firebase Listeners
            db.ref(`game/players/${myId}`).set({ type: type, x: 0, z: 0, r: 0 });
            db.ref(`game/players/${myId}`).onDisconnect().remove();

            db.ref('game/players').on('value', (snap) => {
                const data = snap.val() || {};
                Object.keys(data).forEach(id => {
                    if (id === myId) return;
                    if (!otherPlayers[id]) {
                        otherPlayers[id] = createPlayer(data[id].type, id, false);
                    }
                    otherPlayers[id].target = { x: data[id].x, z: data[id].z, r: data[id].r };
                });
                Object.keys(otherPlayers).forEach(id => {
                    if (!data[id]) {
                        otherPlayers[id].userData.label.remove()
