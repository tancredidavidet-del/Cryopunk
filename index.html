<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRYOPUNK: ULTRA-STABLE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Orbitron', sans-serif; }
        #c3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .selection-screen { position: fixed; inset: 0; z-index: 100; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-char { width: 280px; padding: 20px; margin: 10px; background: #1a1a1a; border: 2px solid #333; color: white; border-radius: 8px; cursor: pointer; text-align: center; font-weight: bold; }
        .btn-char:hover { border-color: #0f0; background: #222; }
        .hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: none; padding: 20px; color: white; }
        .hud * { pointer-events: auto; }
        .d-pad { position: fixed; bottom: 30px; left: 30px; display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; }
        .btn-ctrl { width: 70px; height: 70px; background: rgba(0,0,0,0.8); border: 2px solid #0f0; color: #0f0; display: flex; align-items: center; justify-content: center; font-size: 24px; border-radius: 15px; }
        .btn-ctrl.active { background: #0f0; color: #000; }
        .nametag { position: absolute; color: #0f0; font-size: 10px; background: rgba(0,0,0,0.7); padding: 2px 5px; transform: translate(-50%, -50%); border: 1px solid #0f0; pointer-events: none; white-space: nowrap; }
    </style>
</head>
<body>

    <div id="c3d"></div>
    <div id="tags-container" style="position:absolute; inset:0; z-index:5; pointer-events:none;"></div>

    <!-- SCHERMATA SELEZIONE -->
    <div id="selection-screen" class="selection-screen">
        <h1 style="color:white; letter-spacing: 5px; margin-bottom: 30px;">CRYOPUNK</h1>
        <div class="btn-char" onclick="pick('dave')">DAVE-RIG [ENGINEER]</div>
        <div class="btn-char" onclick="pick('ivan')">IVAN-VST [ASSAULT]</div>
        <div class="btn-char" onclick="pick('jonny')">JONNY-DRK [HACKER]</div>
        <p style="color: #444; font-size: 10px; margin-top: 20px;">CLICCA UN OPERATORE PER INIZIARE</p>
    </div>

    <!-- UI GIOCO -->
    <div id="game-ui" class="hud">
        <div style="background: rgba(0,0,0,0.8); padding: 15px; border-left: 5px solid #0f0; width: fit-content;">
            <div id="p-name" style="font-size: 14px;">UNIT: ---</div>
            <div style="font-size: 9px; color: #0f0; margin-top: 5px;">SISTEMA OPERATIVO ATTIVO</div>
        </div>

        <div class="d-pad">
            <div></div><button class="btn-ctrl" id="up">W</button><div></div>
            <button class="btn-ctrl" id="left">A</button>
            <button class="btn-ctrl" id="down">S</button>
            <button class="btn-ctrl" id="right">D</button>
        </div>
        
        <button onclick="location.reload()" style="position:fixed; bottom:20px; right:20px; background:#300; border:1px solid red; color:white; padding:10px; font-size:10px; cursor:pointer;">ABORT_MISSION</button>
    </div>

    <script>
        console.log("Script inizializzato...");

        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDzCp1PWbf82SfvhpZyXViK0Klf8rgDOcc",
            databaseURL: "https://cryopunk-90f36-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "cryopunk-90f36",
        };
        
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            console.log("Firebase collegato.");
        } catch(e) {
            console.error("Errore Firebase:", e);
        }

        let myId = null, scene, camera, renderer, clock = new THREE.Clock();
        let myMesh = null, otherPlayers = {}, input = {up: false, down: false, left: false, right: false};

        function initEngine() {
            console.log("Avvio motore 3D...");
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.Fog(0x050505, 20, 150);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 25);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('c3d').appendChild(renderer.domElement);

            // Luci
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const sun = new THREE.DirectionalLight(0x00ff00, 0.8);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // Pavimento
            const grid = new THREE.GridHelper(400, 80, 0x00ff00, 0x111111);
            scene.add(grid);

            window.addEventListener('resize', onWindowResize);
            setupInput();
            requestAnimationFrame(loop);
            console.log("Motore 3D pronto.");
        }

        function createPlayer(type, name, isLocal) {
            const colors = { dave: 0x00ffff, ivan: 0xff0044, jonny: 0xaa00ff };
            const color = colors[type] || 0xffffff;
            
            const group = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 3, 1.5),
                new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.4 })
            );
            body.position.y = 1.5;
            group.add(body);

            const visor = new THREE.Mesh(
                new THREE.BoxGeometry(1.6, 0.4, 0.5),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            visor.position.set(0, 2.5, -0.6);
            group.add(visor);

            const label = document.createElement('div');
            label.className = 'nametag';
            label.innerText = isLocal ? "YOU" : name.split('_')[0].toUpperCase();
            document.getElementById('tags-container').appendChild(label);
            group.userData.label = label;

            scene.add(group);
            return group;
        }

        function setupInput() {
            const handleKey = (e, val) => {
                const k = e.key.toLowerCase();
                if(k==='w' || k==='arrowup') input.up = val;
                if(k==='s' || k==='arrowdown') input.down = val;
                if(k==='a' || k==='arrowleft') input.left = val;
                if(k==='d' || k==='arrowright') input.right = val;
            };
            window.onkeydown = (e) => handleKey(e, true);
            window.onkeyup = (e) => handleKey(e, false);

            const bind = (id, key) => {
                const el = document.getElementById(id);
                el.onpointerdown = (e) => { e.preventDefault(); input[key] = true; el.classList.add('active'); };
                el.onpointerup = (e) => { e.preventDefault(); input[key] = false; el.classList.remove('active'); };
            };
            bind('up', 'up'); bind('down', 'down'); bind('left', 'left'); bind('right', 'right');
        }

        function loop() {
            requestAnimationFrame(loop);
            const dt = clock.getDelta();

            if (myMesh) {
                const speed = 18 * dt;
                const rSpeed = 3.5 * dt;

                if (input.up) myMesh.translateZ(-speed);
                if (input.down) myMesh.translateZ(speed);
                if (input.left) myMesh.rotation.y += rSpeed;
                if (input.right) myMesh.rotation.y -= rSpeed;

                // Sync Firebase
                if (db && Math.random() > 0.8) {
                    db.ref(`game/players/${myId}`).update({
                        x: myMesh.position.x, z: myMesh.position.z, r: myMesh.rotation.y
                    });
                }

                // Camera Follow
                const camPos = new THREE.Vector3(0, 18, 25).applyMatrix4(myMesh.matrixWorld);
                camera.position.lerp(camPos, 0.1);
                camera.lookAt(myMesh.position.x, 2, myMesh.position.z);
                
                updateTag(myMesh);
            }

            // Altri giocatori
            Object.keys(otherPlayers).forEach(id => {
                const p = otherPlayers[id];
                if (p.target) {
                    p.position.x = THREE.MathUtils.lerp(p.position.x, p.target.x, 0.15);
                    p.position.z = THREE.MathUtils.lerp(p.position.z, p.target.z, 0.15);
                    p.rotation.y = THREE.MathUtils.lerp(p.rotation.y, p.target.r, 0.15);
                }
                updateTag(p);
            });

            renderer.render(scene, camera);
        }

        function updateTag(mesh) {
            const label = mesh.userData.label;
            if (!label) return;
            const vec = mesh.position.clone().add(new THREE.Vector3(0, 5, 0));
            vec.project(camera);
            label.style.left = `${(vec.x * 0.5 + 0.5) * window.innerWidth}px`;
            label.style.top = `${(-vec.y * 0.5 + 0.5) * window.innerHeight}px`;
            label.style.display = vec.z < 1 ? 'block' : 'none';
        }

        function pick(type) {
            console.log("Giocatore scelto:", type);
            
            // 1. Nascondi subito il menu e mostra la UI
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            
            // 2. Avvia tutto con un leggero ritardo per stabilità
            setTimeout(() => {
                initEngine();
                
                myId = type + "_" + Math.floor(Math.random()*9999);
                document.getElementById('p-name').innerText = "UNIT: " + myId.toUpperCase();
                
                myMesh = createPlayer(type, myId, true);

                if (db) {
                    const userRef = db.ref(`game/players/${myId}`);
                    userRef.set({ type: type, x: 0, z: 0, r: 0 });
                    userRef.onDisconnect().remove();

                    db.ref('game/players').on('value', (snap) => {
                        const data = snap.val() || {};
                        Object.keys(data).forEach(id => {
                            if (id === myId) return;
                            if (!otherPlayers[id]) otherPlayers[id] = createPlayer(data[id].type, id, false);
                            otherPlayers[id].target = { x: data[id].x, z: data[id].z, r: data[id].r };
                        });
                        Object.keys(otherPlayers).forEach(id => {
                            if (!data[id]) {
                                if(otherPlayers[id].userData.label) otherPlayers[id].userData.label.remove();
                                scene.remove(otherPlayers[id]);
                                delete otherPlayers[id];
                            }
                        });
                    });
                }
            }, 100);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
