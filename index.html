<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>CRIOPUNK - REVOLUTION STABLE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00e5ff; z-index: 10; pointer-events: none; }
        .btn { pointer-events: auto; background: rgba(0,229,255,0.2); border: 1px solid #00e5ff; color: #00e5ff; padding: 10px; cursor: pointer; margin-top: 10px; }
        #overlay { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>CRIOPUNK</h1>
        <p>Seleziona il tuo personaggio</p>
        <div style="display: flex; gap: 10px;">
            <button class="btn" onclick="start('davide')">DAVIDE (Cappotto)</button>
            <button class="btn" onclick="start('ivan')">IVAN (Muscoli/Fucile)</button>
            <button class="btn" onclick="start('jonny')">JONNY (Cappuccio)</button>
        </div>
    </div>

    <div id="ui">
        <div id="status">SISTEMA: ONLINE</div>
        <button class="btn" onclick="console.log('Azione')">AZIONE</button>
    </div>

    <script>
        // CONFIGURAZIONE
        const firebaseConfig = {
            apiKey: "AIzaSyDzCp1PWbf82SfvhpZyXViK0Klf8rgDOcc",
            authDomain: "cryopunk-90f36.firebaseapp.com",
            databaseURL: "https://cryopunk-90f36-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "cryopunk-90f36",
            appId: "1:593721385474:web:193026f8d09ca086431940"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let scene, camera, renderer, player, myId;
        const obstacles = [];

        function start(charId) {
            myId = charId;
            document.getElementById('overlay').style.display = 'none';
            init3D();
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 15);
            camera.lookAt(0,0,0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // LUCI
            const light = new THREE.PointLight(0x00e5ff, 2, 50);
            light.position.set(0, 10, 0);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            // AMBIENTE
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(50,50), new THREE.MeshStandardMaterial({color: 0x111111}));
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);

            // MURO E MONITOR
            const wall = new THREE.Mesh(new THREE.BoxGeometry(30, 10, 1), new THREE.MeshStandardMaterial({color: 0x222222}));
            wall.position.set(0, 5, -10);
            scene.add(wall);
            obstacles.push(new THREE.Box3().setFromObject(wall));

            const monitor = new THREE.Mesh(new THREE.PlaneGeometry(8, 4), new THREE.MeshBasicMaterial({color: 0x00e5ff}));
            monitor.position.set(0, 5, -9.4);
            scene.add(monitor);

            // PERSONAGGIO (Davide, Ivan o Jonny)
            player = createPlayer(myId);
            scene.add(player);

            animate();
            
            // Firebase Sync
            db.ref('players/' + myId).set({x: 0, z: 0});
        }

        function createPlayer(id) {
            const g = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 0.5), new THREE.MeshStandardMaterial({color: id === 'davide' ? 0x444444 : (id === 'ivan' ? 0xffffff : 0x000000)}));
            body.position.y = 1;
            g.add(body);
            
            if(id === 'ivan') {
                const gun = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 1.5), new THREE.MeshStandardMaterial({color: 0x000}));
                gun.position.set(0.6, 1.2, 0.5);
                g.add(gun);
            }
            
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshStandardMaterial({color: 0xe0ac69}));
            head.position.y = 2.4;
            g.add(head);

            return g;
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.addEventListener('keydown', (e) => {
            if(!player) return;
            if(e.key === 'ArrowUp') player.position.z -= 0.5;
            if(e.key === 'ArrowDown') player.position.z += 0.5;
            if(e.key === 'ArrowLeft') player.position.x -= 0.5;
            if(e.key === 'ArrowRight') player.position.x += 0.5;
            
            db.ref('players/' + myId).update({x: player.position.x, z: player.position.z});
        });
    </script>
</body>
</html>
