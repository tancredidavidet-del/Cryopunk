<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRYOPUNK: THE VOID SHIP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Orbitron', sans-serif; }
        canvas { display: block; }
        .selection-screen { position: fixed; inset: 0; z-index: 100; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .btn-char { width: 300px; padding: 20px; margin: 10px; background: rgba(0,255,255,0.05); border: 1px solid #0ff; color: #0ff; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 2px; }
        .btn-char:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }
        .hud { position: absolute; top: 20px; left: 20px; z-index: 10; color: #0ff; pointer-events: none; border-left: 3px solid #0ff; padding-left: 15px; display: none; }
        .controls-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.3); font-size: 10px; }
    </style>
</head>
<body>

    <div id="selection-screen" class="selection-screen">
        <h1 style="font-size: 3rem; text-shadow: 0 0 20px #0ff;">CRYOPUNK</h1>
        <p style="color: #666; margin-bottom: 30px;">STAZIONE ORBITALE // SELEZIONE OPERATORE</p>
        <div class="btn-char" onclick="pick('dave')">Operativo DAVE (Scout)</div>
        <div class="btn-char" onclick="pick('ivan')">Operativo IVAN (Tank)</div>
        <div class="btn-char" onclick="pick('jonny')">Operativo JONNY (Hacker)</div>
    </div>

    <div id="game-ui" class="hud">
        <div id="p-name" style="font-weight: 900;">UNIT: ---</div>
        <div style="font-size: 10px; opacity: 0.7;">POSIZIONE: PONTE DI COMANDO</div>
    </div>

    <div class="controls-hint">USA WASD PER MUOVERTI // MOUSE PER RUOTARE</div>

    <script>
        // CONFIGURAZIONE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDzCp1PWbf82SfvhpZyXViK0Klf8rgDOcc",
            databaseURL: "https://cryopunk-90f36-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "cryopunk-90f36",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let scene, camera, renderer, clock = new THREE.Clock();
        let myId, myMesh, otherPlayers = {}, input = {up:false, down:false, left:false, right:false};

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.05);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // ILLUMINAZIONE REALISTICA
            const ambient = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambient);

            // COSTRUZIONE ASTRONAVE (Corridoio modulare)
            createStarship();

            window.addEventListener('resize', onResize);
            setupControls();
            animate();
        }

        function createStarship() {
            // Pavimento metallico
            const floorGeo = new THREE.PlaneGeometry(20, 200);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x111111, metalness: 0.9, roughness: 0.1 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Pareti con pannelli e luci neon
            for (let z = -100; z < 100; z += 10) {
                // Pannello Parete Sinistra
                addWallPanel(-10, z, true);
                // Pannello Parete Destra
                addWallPanel(10, z, false);
                
                // Luce Neon Blu
                const light = new THREE.PointLight(0x00ffff, 1, 15);
                light.position.set(z % 20 === 0 ? -9 : 9, 3, z);
                scene.add(light);
            }
        }

        function addWallPanel(x, z, left) {
            const wall = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 8, 10),
                new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 1, roughness: 0.3 })
            );
            wall.position.set(x, 4, z);
            scene.add(wall);

            // Striscia Neon
            const neon = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, 4, 0.2),
                new THREE.MeshBasicMaterial({ color: 0x00ffff })
            );
            neon.position.set(left ? x + 0.3 : x - 0.3, 4, z);
            scene.add(neon);
        }

        function createHumanoid(type) {
            const colors = { dave: 0x00ffff, ivan: 0xff4400, jonny: 0xff00ff };
            const group = new THREE.Group();

            // Materiale tuta spaziale
            const suitMat = new THREE.MeshStandardMaterial({ color: colors[type], metalness: 0.8, roughness: 0.2 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });

            // Gambe
            const legGeo = new THREE.CapsuleGeometry(0.15, 0.6, 4, 8);
            const lLeg = new THREE.Mesh(legGeo, suitMat);
            lLeg.position.set(-0.25, 0.4, 0);
            group.add(lLeg);
            const rLeg = new THREE.Mesh(legGeo, suitMat);
            rLeg.position.set(0.25, 0.4, 0);
            group.add(rLeg);

            // Tronco (Forma a V)
            const torso = new THREE.Mesh(
                new THREE.CylinderGeometry(0.4, 0.25, 1, 8),
                suitMat
            );
            torso.position.y = 1.3;
            group.add(torso);

            // Braccia
            const armGeo = new THREE.CapsuleGeometry(0.1, 0.5, 4, 8);
            const lArm = new THREE.Mesh(armGeo, suitMat);
            lArm.position.set(-0.5, 1.5, 0);
            lArm.rotation.z = 0.2;
            group.add(lArm);
            const rArm = new THREE.Mesh(armGeo, suitMat);
            rArm.position.set(0.5, 1.5, 0);
            rArm.rotation.z = -0.2;
            group.add(rArm);

            // Testa + Casco
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), skinMat);
            head.position.y = 2.1;
            group.add(head);

            const helmet = new THREE.Mesh(
                new THREE.SphereGeometry(0.3, 16, 16, 0, Math.PI * 2, 0, Math.PI/2),
                new THREE.MeshStandardMaterial({ color: 0x000000, transparent: true, opacity: 0.7, metalness: 1 })
            );
            helmet.position.y = 2.1;
            group.add(helmet);

            scene.add(group);
            return group;
        }

        function setupControls() {
            window.onkeydown = (e) => {
                if(e.key.toLowerCase()==='w') input.up=true;
                if(e.key.toLowerCase()==='s') input.down=true;
                if(e.key.toLowerCase()==='a') input.left=true;
                if(e.key.toLowerCase()==='d') input.right=true;
            };
            window.onkeyup = (e) => {
                if(e.key.toLowerCase()==='w') input.up=false;
                if(e.key.toLowerCase()==='s') input.down=false;
                if(e.key.toLowerCase()==='a') input.left=false;
                if(e.key.toLowerCase()==='d') input.right=false;
            };
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            if (myMesh) {
                const speed = 10 * dt;
                const rotSpeed = 3 * dt;

                if (input.up) myMesh.translateZ(-speed);
                if (input.down) myMesh.translateZ(speed);
                if (input.left) myMesh.rotation.y += rotSpeed;
                if (input.right) myMesh.rotation.y -= rotSpeed;

                // Sync Firebase
                if (Math.random() > 0.7) {
                    db.ref(`game/players/${myId}`).update({
                        x: myMesh.position.x, z: myMesh.position.z, r: myMesh.rotation.y
                    });
                }

                // Terza persona fluida
                const camOffset = new THREE.Vector3(0, 5, 8).applyMatrix4(myMesh.matrixWorld);
                camera.position.lerp(camOffset, 0.1);
                camera.lookAt(myMesh.position.x, 2, myMesh.position.z);
            }

            // Update altri giocatori
            Object.keys(otherPlayers).forEach(id => {
                const p = otherPlayers[id];
                if (p.target) {
                    p.position.x = THREE.MathUtils.lerp(p.position.x, p.target.x, 0.1);
                    p.position.z = THREE.MathUtils.lerp(p.position.z, p.target.z, 0.1);
                    p.rotation.y = THREE.MathUtils.lerp(p.rotation.y, p.target.r, 0.1);
                }
            });

            renderer.render(scene, camera);
        }

        function pick(type) {
            myId = type + "_" + Math.floor(Math.random()*1000);
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('p-name').innerText = "OPERATIVO: " + type.toUpperCase();

            init();
            myMesh = createHumanoid(type);

            // Network
            db.ref(`game/players/${myId}`).set({ type: type, x: 0, z: 0, r: 0 });
            db.ref(`game/players/${myId}`).onDisconnect().remove();

            db.ref('game/players').on('value', (snap) => {
                const data = snap.val() || {};
                Object.keys(data).forEach(id => {
                    if (id === myId) return;
                    if (!otherPlayers[id]) otherPlayers[id] = createHumanoid(data[id].type);
                    otherPlayers[id].target = { x: data[id].x, z: data[id].z, r: data[id].r };
                });
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
