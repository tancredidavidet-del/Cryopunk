<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRYOPUNK: BRAWL EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@900&family=Share+Tech+Mono&display=swap');
        
        body { font-family: 'Kanit', sans-serif; background: #222; margin: 0; overflow: hidden; }
        canvas { display: block; position: fixed; inset: 0; z-index: 1; }
        
        /* UI Layer */
        .ui-layer { position: relative; z-index: 10; pointer-events: none; height: 100vh; display: flex; flex-direction: column; }
        .ui-layer * { pointer-events: auto; }

        /* HUD Stile Brawl */
        .brawl-bar { background: rgba(0,0,0,0.5); border: 4px solid #000; border-radius: 12px; overflow: hidden; height: 24px; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        .hp-fill { background: #4ef037; height: 100%; transition: width 0.3s; }
        .pa-badge { background: #ffce00; border: 4px solid #000; color: #000; text-shadow: none; }

        /* Schermata Selezione */
        .selection-screen { position: fixed; inset: 0; z-index: 500; background: #3b82f6; display: flex; flex-direction: column; padding: 20px; align-items: center; justify-content: center; }
        .char-card { background: #fff; border: 6px solid #000; border-radius: 20px; transition: 0.2s; cursor: pointer; width: 100%; max-width: 300px; margin-bottom: 15px; padding: 15px; display: flex; align-items: center; gap: 15px; }
        .char-card.occupied { opacity: 0.5; filter: grayscale(1); pointer-events: none; }
        .char-card:active { transform: translateY(4px); }

        /* Controlli Movimento */
        .d-pad { position: fixed; bottom: 30px; left: 30px; display: grid; grid-template-columns: repeat(3, 50px); gap: 10px; }
        .ctrl-btn { width: 55px; height: 55px; background: #fff; border: 4px solid #000; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 6px 0 #888; }
        .ctrl-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #888; }
        
        .action-btns { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 10px; }
        .action-btn { background: #ff4747; color: white; border: 4px solid #000; padding: 15px 30px; border-radius: 50px; font-weight: 900; box-shadow: 0 6px 0 #b32d2d; }
    </style>
</head>
<body>

    <div id="selection-screen" class="selection-screen">
        <h1 class="text-white text-5xl font-black italic mb-8 uppercase tracking-tighter" style="-webkit-text-stroke: 3px #000;">SCEGLI EROE</h1>
        <div id="char-grid" class="w-full flex flex-col items-center"></div>
    </div>

    <div id="game-ui" class="ui-layer hidden">
        <!-- TOP HUD -->
        <div class="p-4 flex justify-between items-start">
            <div class="w-1/2">
                <div id="char-name" class="text-white text-xl italic uppercase mb-1" style="-webkit-text-stroke: 1px #000;">---</div>
                <div class="brawl-bar w-full">
                    <div id="hp-fill" class="hp-fill" style="width: 100%"></div>
                </div>
            </div>
            <div class="pa-badge px-4 py-1 rounded-xl flex flex-col items-center">
                <span class="text-[10px] font-black uppercase">Energia</span>
                <span id="pa-display" class="text-3xl font-black">4</span>
            </div>
        </div>

        <!-- MOVIMENTO (D-PAD) -->
        <div class="d-pad">
            <div></div>
            <button class="ctrl-btn" onclick="muoviti('avanti')">▲</button>
            <div></div>
            <button class="ctrl-btn" onclick="ruota('sinistra')">◀</button>
            <button class="ctrl-btn" onclick="muoviti('indietro')">▼</button>
            <button class="ctrl-btn" onclick="ruota('destra')">▶</button>
        </div>

        <!-- AZIONI -->
        <div class="action-btns">
            <button class="action-btn" onclick="fruga()">🔍 SCAN</button>
            <button class="action-btn bg-yellow-400 !border-yellow-900 !text-black !box-shadow-none" style="box-shadow: 0 6px 0 #a18600;" onclick="passaTurno()">FINE TURNO</button>
        </div>
        
        <div id="log" class="fixed top-24 left-4 right-4 h-12 overflow-hidden text-white text-[10px] uppercase font-bold italic pointer-events-none opacity-80"></div>
    </div>

    <script>
        // CONFIG FIREBASE (Sostituisci con la tua chiave)
        const firebaseConfig = {
            apiKey: "AIzaSyDzCp1PWbf82SfvhpZyXViK0Klf8rgDOcc",
            databaseURL: "https://cryopunk-90f36-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "cryopunk-90f36",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const TEAM_DATA = {
            dave: { n: "DAVE-RIG", color: "#fbbf24", hair: 0x000000, body: "normal", catch: "Interessante." },
            jonny: { n: "JONNY DARK", color: "#bc6ff1", hair: 0x000000, body: "slim", catch: "Pessimo." },
            ivan: { n: "IVAN-VOSTOK", color: "#ff2e63", hair: 0x5d4037, body: "massive", catch: "Si... farai carriera." },
            sara: { n: "SARA-MED", color: "#10b981", hair: 0x333333, body: "normal", catch: "Analisi terminata." },
            axel: { n: "AXEL-01", color: "#00d4ff", hair: 0xcccccc, body: "android", catch: "Efficienza 100%." }
        };

        let myId = null;
        let gameState = {};
        let scene, camera, renderer, charMeshes = {};
        let pa = 4;

        // INIZIALIZZAZIONE 3D (Risoluzione Maggiore e Luce)
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x555555);
            
            camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio); // Alta risoluzione
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Luci Brawl Style (Forti)
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(10, 20, 10);
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            // Griglia Pavimento chiara
            const grid = new THREE.GridHelper(200, 40, 0x000000, 0x888888);
            scene.add(grid);

            // Creazione Eroi Grandi
            Object.keys(TEAM_DATA).forEach(id => {
                const char = TEAM_DATA[id];
                const group = new THREE.Group();
                
                // Corpo (Scalato 2.5x per stile Brawl)
                const bodyGeo = (id==='ivan') ? new THREE.BoxGeometry(3, 4, 2) : new THREE.BoxGeometry(2, 5, 1.5);
                const body = new THREE.Mesh(bodyGeo, new THREE.MeshPhongMaterial({color: char.color}));
                body.position.y = 2.5; 
                group.add(body);

                // Testa grande
                const head = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.8, 1.8), new THREE.MeshPhongMaterial({color: 0xffdbac}));
                head.position.y = 5.5; 
                group.add(head);

                // Capelli Dave/Ivan
                const hair = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 2), new THREE.MeshBasicMaterial({color: char.hair}));
                hair.position.y = 6.2;
                if(id === 'ivan') hair.rotation.z = 0.5;
                group.add(hair);

                scene.add(group);
                charMeshes[id] = group;
                
                // Posizione iniziale
                group.position.set(Math.random()*10 - 5, 0, Math.random()*10 - 5);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (myId && charMeshes[myId]) {
                const target = charMeshes[myId].position;
                // Camera Isometrica (Stile Brawl)
                camera.position.set(target.x, target.y + 25, target.z + 25);
                camera.lookAt(target.x, target.y, target.z);
            }
            renderer.render(scene, camera);
        }

        // SINCRONIZZAZIONE FIREBASE
        db.ref('game').on('value', (snap) => {
            gameState = snap.val();
            if (!gameState) initServer();
            else {
                if (!myId) updateSelectionUI();
                else syncPlayers();
            }
        });

        function initServer() {
            const initial = { players: {} };
            Object.keys(TEAM_DATA).forEach(k => {
                initial.players[k] = { x: 0, z: 0, rot: 0, h: 100, s: 'LIBERO' };
            });
            db.ref('game').set(initial);
        }

        function updateSelectionUI() {
            const grid = document.getElementById('char-grid');
            grid.innerHTML = Object.keys(TEAM_DATA).map(key => {
                const occupied = gameState.players[key].s !== 'LIBERO';
                return `
                    <div class="char-card ${occupied ? 'occupied' : ''}" onclick="pick('${key}')">
                        <div class="w-12 h-12 rounded-full" style="background:${TEAM_DATA[key].color}"></div>
                        <div class="flex-1">
                            <div class="font-black text-lg uppercase">${TEAM_DATA[key].n}</div>
                            <div class="text-xs text-blue-600 font-bold uppercase">${occupied ? 'In Partita' : 'Disponibile'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function pick(id) {
            myId = id;
            db.ref(`game/players/${id}/s`).set('OCCUPATO');
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('char-name').innerText = TEAM_DATA[id].n;
            init3D();
        }

        function syncPlayers() {
            Object.keys(gameState.players).forEach(id => {
                const p = gameState.players[id];
                if(charMeshes[id]) {
                    charMeshes[id].position.x = p.x;
                    charMeshes[id].position.z = p.z;
                    charMeshes[id].rotation.y = p.rot;
                }
            });
            document.getElementById('hp-fill').style.width = gameState.players[myId].h + "%";
        }

        // MOVIMENTO MANUALE (1 PA per azione)
        function muoviti(direzione) {
            if(pa < 0.1) return;
            const mesh = charMeshes[myId];
            const step = 4; // Passo lungo stile brawl
            
            if(direzione === 'avanti') {
                mesh.translateZ(-step);
            } else {
                mesh.translateZ(step);
            }
            
            pa -= 0.5; // Ogni passo consuma mezzo PA
            updateDatabase();
        }

        function ruota(dir) {
            const mesh = charMeshes[myId];
            if(dir === 'sinistra') mesh.rotation.y += 0.5;
            else mesh.rotation.y -= 0.5;
            updateDatabase();
        }

        function updateDatabase() {
            document.getElementById('pa-display').innerText = Math.floor(pa);
            db.ref(`game/players/${myId}`).update({
                x: charMeshes[myId].position.x,
                z: charMeshes[myId].position.z,
                rot: charMeshes[myId].rotation.y
            });
        }

        function passaTurno() {
            pa = 4;
            document.getElementById('pa-display').innerText = pa;
            // Mostra frasi tipiche Ivan/Jonny nel log rapido
            const msg = (myId === 'ivan') ? TEAM_DATA.ivan.catch : (myId === 'jonny' ? TEAM_DATA.jonny.catch : "Turno concluso.");
            document.getElementById('log').innerHTML = `> ${TEAM_DATA[myId].n}: "${msg}"`;
            setTimeout(() => document.getElementById('log').innerHTML = "", 3000);
        }

        function fruga() {
            if(pa < 1) return;
            pa--;
            document.getElementById('pa-display').innerText = pa;
            if(myId === 'dave') document.getElementById('log').innerHTML = `> DAVE-RIG: "Interessante..."`;
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
