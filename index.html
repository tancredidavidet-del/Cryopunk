<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CRIOPUNK - OFFICIAL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Post-Processing per luci realistiche -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap');
        
        :root { --primary: #00e5ff; --accent: #ff0033; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Share Tech Mono', monospace; color: white; }
        #game-canvas { position: fixed; inset: 0; z-index: 1; }

        .selection-screen {
            position: fixed; inset: 0; z-index: 100; 
            background: radial-gradient(circle at center, #0a1120 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .title-glow {
            font-family: 'Orbitron', sans-serif; font-size: 5rem; font-weight: 900; 
            text-shadow: 0 0 30px var(--primary); font-style: italic; letter-spacing: 15px; color: #fff;
        }

        .char-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            padding: 30px; border-radius: 20px; cursor: pointer; transition: 0.4s; text-align: left;
            min-width: 300px;
        }
        .char-card:hover { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); transform: scale(1.05); }
        .char-card.occupied { opacity: 0.2; pointer-events: none; filter: grayscale(1); }

        .ui-layer { position: relative; z-index: 10; pointer-events: none; height: 100vh; display: flex; flex-direction: column; padding: 25px; }
        .ui-layer * { pointer-events: auto; }
        
        #hp-fill { height: 10px; width: 100%; background: linear-gradient(90deg, var(--accent), var(--primary)); border-radius: 5px; transition: 0.5s; }

        #joystick-zone { width: 140px; height: 140px; border: 2px solid var(--primary); border-radius: 50%; position: absolute; bottom: 50px; left: 50px; background: rgba(0,229,255,0.05); backdrop-filter: blur(8px); }
        #joystick-knob { width: 50px; height: 50px; background: var(--primary); border-radius: 50%; position: absolute; top: 45px; left: 45px; box-shadow: 0 0 25px var(--primary); }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="selection-screen" class="selection-screen">
        <div class="title-glow">CRIOPUNK</div>
        <div class="text-cyan-400 tracking-[0.8em] text-xs uppercase mb-10">Sector Alpha Sinc</div>
        <div id="char-grid" class="flex flex-wrap justify-center gap-6"></div>
    </div>

    <div id="game-ui" class="ui-layer hidden">
        <div class="w-64">
            <div class="text-[10px] text-cyan-400 font-bold mb-1">ARMOR INTEGRITY</div>
            <div class="bg-black/50 border border-white/20 p-1 rounded-lg"><div id="hp-fill"></div></div>
        </div>

        <div class="mt-auto flex flex-col gap-4">
            <div id="log" class="h-20 overflow-y-auto text-[10px] text-neutral-400 bg-black/60 p-3 rounded border border-white/5"></div>
            <div class="flex gap-2">
                <button onclick="fruga()" class="flex-1 bg-white/5 border border-white/20 p-4 rounded-xl font-bold text-[10px] hover:bg-white/10">TERMINALE</button>
                <button onclick="attacca()" class="flex-1 bg-red-600/20 border border-red-500/50 p-4 rounded-xl font-bold text-[10px] hover:bg-red-600/40">FUOCO</button>
            </div>
            <div style="height: 180px;"></div>
        </div>
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDzCp1PWbf82SfvhpZyXViK0Klf8rgDOcc",
            authDomain: "cryopunk-90f36.firebaseapp.com",
            databaseURL: "https://cryopunk-90f36-default-rtdb.firebaseio.com",
            projectId: "cryopunk-90f36",
            storageBucket: "cryopunk-90f36.appspot.com",
            appId: "1:593721385474:web:193026f8d09ca086431940"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const ROOM_PATH = "criopunk_final_sector";

        const TEAM = {
            davide: { n: "DAVIDE", desc: "Cappotto lungo grigio, fisico slanciato", slot: "p1" },
            ivan: { n: "IVAN", desc: "Muscoloso, Fucile, Mimetico", slot: "p2" },
            jonny: { n: "JONNY", desc: "Cappuccio, Pantaloni beige larghi", slot: "p3" }
        };

        let scene, camera, renderer, composer, localPlayerMesh;
        let myId, mySlot, myPlayerRef;
        let remotePlayers = {};
        let joystickVector = { x: 0, y: 0 };
        const obstacles = [];

        function initApp() {
            const grid = document.getElementById('char-grid');
            db.ref(ROOM_PATH).on('value', snap => {
                const state = snap.val() || {};
                grid.innerHTML = Object.keys(TEAM).map(k => {
                    const char = TEAM[k];
                    const occ = !!state[char.slot];
                    return `
                        <div class="char-card ${occ ? 'occupied' : ''}" onclick="selectChar('${k}')">
                            <div class="text-2xl font-black text-white">${char.n}</div>
                            <div class="text-[10px] text-cyan-400 mt-2">${char.desc}</div>
                        </div>
                    `;
                }).join('');
                syncRemote(state);
            });
        }

        function selectChar(key) {
            const slot = TEAM[key].slot;
            db.ref(`${ROOM_PATH}/${slot}`).transaction(curr => {
                if (curr) return;
                return { charKey: key, x: 0, z: 0, angle: 0, hp: 100 };
            }, (err, ok) => { if (ok) start(key, slot); });
        }

        function start(key, slot) {
            myId = key; mySlot = slot;
            myPlayerRef = db.ref(`${ROOM_PATH}/${mySlot}`);
            myPlayerRef.onDisconnect().remove();
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-ui').classList.remove('hidden');
            init3D();
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.05);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 15);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ReinhardToneMapping;

            const renderPass = new THREE.RenderPass(scene, camera);
            const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.4, 0.85);
            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderPass); composer.addPass(bloomPass);

            buildMap();
            localPlayerMesh = createHuman(myId);
            scene.add(localPlayerMesh);

            setupJoystick();
            animate();
        }

        function buildMap() {
            // Pavimento lucido
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1, metalness: 0.8 }));
            floor.rotation.x = -Math.PI/2; scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9 });
            const addObj = (w, h, d, x, z, mat = wallMat) => {
                const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
                m.position.set(x, h/2, z); scene.add(m);
                obstacles.push(new THREE.Box3().setFromObject(m));
            };

            // Pareti
            addObj(60, 15, 1, 0, -30); // Nord
            addObj(60, 15, 1, 0, 30);  // Sud
            addObj(1, 15, 60, -30, 0); // Ovest
            addObj(1, 15, 60, 30, 0);  // Est

            // TUBI LUNGO LE PARETI
            for(let i=0; i<3; i++){
                const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 60, 12), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 1 }));
                pipe.rotation.z = Math.PI/2; pipe.position.set(0, 2+i*4, -29.5); scene.add(pipe);
            }

            // MONITOR GIGANTI
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const tex = new THREE.CanvasTexture(canvas);
            setInterval(() => {
                ctx.fillStyle = '#000'; ctx.fillRect(0,0,512,256);
                ctx.strokeStyle = '#00e5ff'; ctx.strokeRect(10,10,492,236);
                ctx.fillStyle = '#00e5ff'; ctx.font = '20px monospace';
                ctx.fillText("SECTOR: CRYOPUNK-90F36", 30, 50);
                ctx.fillText(`ROUTE: ${Math.random().toFixed(5)}`, 30, 90);
                ctx.fillText(`X-COORD: ${Math.random().toFixed(2)}`, 30, 130);
                ctx.beginPath(); ctx.moveTo(300, 50); ctx.lineTo(450, 200); ctx.stroke();
                tex.needsUpdate = true;
            }, 150);

            const screen = new THREE.Mesh(new THREE.PlaneGeometry(12, 6), new THREE.MeshBasicMaterial({ map: tex }));
            screen.position.set(0, 6, -29.4); scene.add(screen);

            scene.add(new THREE.PointLight(0x00e5ff, 2, 50));
            scene.add(new THREE.AmbientLight(0xffffff, 0.1));
        }

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25), skin);
            head.position.y = 2.1; g.add(head);

                const legs = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 0.3), new THREE.MeshStandardMaterial({ color: 0x4b3621 }));
